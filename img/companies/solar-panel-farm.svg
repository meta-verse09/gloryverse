<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="solarCell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6fa8"/>
      <stop offset="100%" stop-color="#0b3b60"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#e08b12"/>
    </linearGradient>
  </defs>
  <!-- Ground isometric diamond -->
  <polygon points="80,28 148,66 80,104 12,66" fill="#e6eef5" stroke="#c2d2e0" stroke-width="1.5"/>
  <polygon points="80,104 148,66 148,74 80,112" fill="#bac9d8"/>
  <polygon points="80,104 12,66 12,74 80,112" fill="#cdd9e5"/>
  <!-- Support stands -->
  <polygon points="48,64 52,66 52,78 48,76" fill="#52606d"/>
  <polygon points="94,82 98,84 98,94 94,92" fill="#52606d"/>
  <!-- Solar panel 1 (back) -->
  <polygon points="44,44 92,18 118,34 70,60" fill="#cbd2d9" stroke="#7b8794" stroke-width="1.2"/>
  <polygon points="47,44 91,20 114,34 70,58" fill="url(#solarCell)"/>
  <path d="M58,38 L81,52 M69,32 L92,46 M80,26 L103,40 M58,51 L102,27" stroke="#62b0e8" stroke-width="0.9" opacity="0.7"/>
  <!-- Solar panel 2 (front) -->
  <polygon points="34,62 82,36 108,52 60,78" fill="#cbd2d9" stroke="#7b8794" stroke-width="1.2"/>
  <polygon points="37,62 81,38 104,52 60,76" fill="url(#solarCell)"/>
  <path d="M48,56 L71,70 M59,50 L82,64 M70,44 L93,58 M48,69 L92,45" stroke="#62b0e8" stroke-width="0.9" opacity="0.7"/>
  <!-- Inverter / Battery box -->
  <polygon points="104,64 122,54 136,62 118,72" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="1"/>
  <polygon points="104,64 118,72 118,86 104,78" fill="#cbd2d9"/>
  <polygon points="118,72 136,62 136,76 118,86" fill="#9aa5b1"/>
  <!-- Energy bolt badge -->
  <circle cx="127" cy="40" r="11" fill="url(#sunGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="128,33 122,41 127,41 125,47 132,39 127,39" fill="#ffffff"/>
</svg>
