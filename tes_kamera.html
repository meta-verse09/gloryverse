<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GloryVerse - Tes Kamera Belakang</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html,body{ height:100%; margin:0; background:#0b1630; color:#f3efe3; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #map{ position:absolute; inset:0; }
  #hud{ position:fixed; z-index:10; left:8px; right:8px; top:8px; background:rgba(11,22,48,.92); border:1px solid #f2a516; border-radius:10px; padding:8px 10px; font-size:13px; }
  .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .row:first-child{ margin-top:0; }
  select,button{ background:#1b2a4d; color:#f3efe3; border:1px solid #3a4b76; border-radius:8px; padding:6px 8px; font-size:13px; }
  button.go{ background:#f2a516; color:#0b1630; border-color:#f2a516; font-weight:700; }
  label{ display:flex; gap:4px; align-items:center; }
  input[type=range]{ width:90px; }
  #status{ margin-top:6px; line-height:1.4; }
  #status b{ color:#f2a516; }
  .truck{ pointer-events:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.55)); }
  .truck svg{ width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="row"><select id="from"></select><span>ke</span><select id="to"></select><button id="go" class="go">Mulai</button></div>
  <div class="row">
    <label><input type="checkbox" id="topo"> Topografi</label>
    <label><input type="checkbox" id="follow" checked> Kamera ikut</label>
    <label>Kecepatan <select id="mult"><option value="1">x1 (nyata)</option><option value="10" selected>x10</option><option value="60">x60</option><option value="300">x300</option></select></label>
  </div>
  <div class="row">
    <label>Miring <input type="range" id="pitch" min="0" max="80" value="65"></label>
    <label>Zoom <input type="range" id="zoom" min="13" max="19" step="0.5" value="16.5"></label>
  </div>
  <div id="status">Pilih kota asal dan tujuan, lalu tekan Mulai.</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ====== 1. DATA NYATA: kota (koordinat sungguhan), rute jalan dari OSM lewat OSRM ======
const CITIES = [
  {n:'Medan',p:[98.6722,3.5952]},{n:'Pekanbaru',p:[101.4478,0.5071]},{n:'Padang',p:[100.4172,-0.9471]},
  {n:'Jambi',p:[103.6131,-1.6101]},{n:'Bengkulu',p:[102.2655,-3.8004]},{n:'Palembang',p:[104.7754,-2.9761]},
  {n:'Bandar Lampung',p:[105.2668,-5.3971]},{n:'Jakarta',p:[106.8456,-6.2088]},{n:'Bandung',p:[107.6191,-6.9175]},
  {n:'Cirebon',p:[108.5523,-6.7320]},{n:'Semarang',p:[110.4167,-6.9667]},{n:'Yogyakarta',p:[110.3695,-7.7956]},
  {n:'Surabaya',p:[112.7521,-7.2575]}
];   // urutan koordinat: [bujur, lintang] (format MapLibre)
const TRUCK_KMH = 50;      // kecepatan truk di tampilan ini (km/jam), nanti diganti model kecepatan game
const TRUCK_EXAG = 4;      // pembesar ukuran truk supaya terlihat (ukuran asli terlalu kecil di peta)
const AHEAD_M = 40;        // arah hadap truk dihitung dari titik sekian meter di depannya

const $ = id => document.getElementById(id);
CITIES.forEach((c,i) => { $('from').add(new Option(c.n,i)); $('to').add(new Option(c.n,i)); });
$('from').value = 2; $('to').value = 1;     // Padang ke Pekanbaru

// ====== 2. PETA: OSM + OpenTopoMap (topografi) ======
const map = new maplibregl.Map({
  container:'map', center:[106.8,-3], zoom:5, pitch:0, maxPitch:80,
  style:{ version:8,
    sources:{
      osm:{ type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, maxzoom:19, attribution:'&copy; OpenStreetMap' },
      // maxzoom 17 = tile asli OpenTopoMap berhenti di zoom 17; di atasnya peta memperbesar tile yang ada
      topo:{ type:'raster', tiles:['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png','https://c.tile.opentopomap.org/{z}/{x}/{y}.png'],
             tileSize:256, maxzoom:17, attribution:'Topografi: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA), SRTM' }
    },
    layers:[ {id:'osm',type:'raster',source:'osm'}, {id:'topo',type:'raster',source:'topo',layout:{visibility:'none'}} ]
  }
});
map.on('load', () => {
  map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'route-casing',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#7a4b00','line-width':9,'line-opacity':.9}});
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f2a516','line-width':5}});
});
$('topo').onchange = () => map.setLayoutProperty('topo','visibility',$('topo').checked ? 'visible' : 'none');

// ====== 3. TRUK: ikon dilihat dari atas, rebah di permukaan peta, ukurannya ikut zoom ======
const el = document.createElement('div');
el.className = 'truck';
el.innerHTML = '<svg viewBox="0 0 30 62"><rect x="1" y="6" width="5" height="12" rx="1.5" fill="#222"/><rect x="24" y="6" width="5" height="12" rx="1.5" fill="#222"/><rect x="1" y="32" width="5" height="26" rx="1.5" fill="#222"/><rect x="24" y="32" width="5" height="26" rx="1.5" fill="#222"/><rect x="4" y="22" width="22" height="38" rx="2" fill="#dfe3e6" stroke="#6b737b"/><rect x="5" y="3" width="20" height="17" rx="3" fill="#f2a516" stroke="#8a5d05"/><rect x="8" y="6" width="14" height="5" fill="#9bd1f0"/></svg>';
const truck = new maplibregl.Marker({element:el, pitchAlignment:'map', rotationAlignment:'map'}).setLngLat(CITIES[2].p).addTo(map);
function sizeTruck(lat){      // truk nyata sekitar 9 m x 2,5 m; piksel per meter bergantung zoom dan lintang
  const mpp = 156543.03*Math.cos(lat*Math.PI/180)/Math.pow(2,map.getZoom());
  el.style.height = Math.max(14, 9*TRUCK_EXAG/mpp)+'px';
  el.style.width  = Math.max(7, 4.3*TRUCK_EXAG/mpp)+'px';
}

// ====== 4. RUTE JALAN NYATA (OSRM) ======
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function hav(a,b){ const R=6371000, dLa=rad(b[1]-a[1]), dLo=rad(b[0]-a[0]); const h=Math.sin(dLa/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function brg(a,b){ const f1=rad(a[1]), f2=rad(b[1]), dl=rad(b[0]-a[0]); const y=Math.sin(dl)*Math.cos(f2), x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl); return (deg(Math.atan2(y,x))+360)%360; }
let pts = [], cum = [], total = 0, d = 0, running = false, last = 0, hTruck = 0, hCam = 0;

async function loadRoute(a,b){
  const url = 'https://router.project-osrm.org/route/v1/driving/'+a[0]+','+a[1]+';'+b[0]+','+b[1]+'?overview=full&geometries=geojson';
  const j = await (await fetch(url)).json();
  if (j.code !== 'Ok') throw new Error(j.code);
  return j.routes[0].geometry.coordinates;
}
function posAt(dist){
  let lo=0, hi=cum.length-1;
  while (hi-lo>1){ const m=(lo+hi)>>1; if (cum[m]<=dist) lo=m; else hi=m; }
  const seg=cum[hi]-cum[lo]||1, f=Math.min(1,Math.max(0,(dist-cum[lo])/seg)), p=pts[lo], q=pts[hi];
  return [p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f];
}
const fmtT = s => { s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? h+'j '+m+'m' : m+'m '+(s%60)+'d'; };

$('go').onclick = async () => {
  const A = CITIES[+$('from').value], B = CITIES[+$('to').value];
  if (A === B){ $('status').textContent = 'Asal dan tujuan harus beda.'; return; }
  running = false; $('status').textContent = 'Menghitung rute jalan nyata...';
  try {
    pts = await loadRoute(A.p, B.p);
  } catch(e){ $('status').textContent = 'Server rute tidak bisa dihubungi. Coba lagi sebentar lagi.'; return; }
  cum = [0]; for (let i=1;i<pts.length;i++) cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  total = cum[cum.length-1]; d = 0;
  map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:pts}});
  hTruck = hCam = brg(pts[0], posAt(Math.min(total, AHEAD_M)));
  truck.setLngLat(pts[0]).setRotation(hTruck);
  setFollow(); map.jumpTo({center:pts[0], bearing:hCam, pitch:+$('pitch').value, zoom:+$('zoom').value});
  running = true; last = performance.now();
  $('status').dataset.info = A.n+' ke '+B.n+', '+(total/1000).toFixed(0)+' km';
  requestAnimationFrame(frame);
};

// ====== 5. KAMERA IKUT DARI BELAKANG ======
function setFollow(){
  const pad = $('follow').checked ? Math.round(map.getContainer().clientHeight*0.32) : 0;
  map.setPadding({top:pad, bottom:0, left:0, right:0});
}
$('follow').onchange = setFollow;
const turn = (cur,target,k) => cur + (((target-cur+540)%360)-180)*k;

function frame(now){
  if (!running) return;
  const dt = Math.min(0.1,(now-last)/1000); last = now;
  const mult = +$('mult').value;
  d = Math.min(total, d + TRUCK_KMH/3.6*mult*dt);
  const p = posAt(d), ahead = posAt(Math.min(total, d+AHEAD_M));
  if (hav(p,ahead) > 1){ const t = brg(p,ahead); hTruck = turn(hTruck,t,1-Math.exp(-dt*6)); hCam = turn(hCam,t,1-Math.exp(-dt*1.5)); }
  truck.setLngLat(p).setRotation(hTruck); sizeTruck(p[1]);
  if ($('follow').checked) map.jumpTo({center:p, bearing:hCam, pitch:+$('pitch').value, zoom:+$('zoom').value});
  const left = total-d;
  $('status').innerHTML = '<b>'+$('status').dataset.info+'</b>. Sisa '+(left/1000).toFixed(1)+' km, tiba dalam <b>'+fmtT(left/(TRUCK_KMH/3.6*mult))+'</b> pada kecepatan tampilan ini.';
  if (d >= total){ running = false; $('status').innerHTML = '<b>'+$('status').dataset.info+'</b>. Truk sudah tiba.'; return; }
  requestAnimationFrame(frame);
}
sizeTruck(CITIES[2].p[1]);
map.on('zoom', () => sizeTruck(truck.getLngLat().lat));
</script>
</body>
</html>
