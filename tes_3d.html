<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedisi Basung 3D</title>
<script src="https://unpkg.com/maplibre-gl@3.6/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6/dist/maplibre-gl.css" rel="stylesheet">
<style>
  body{margin:0; overflow:hidden; font-family: sans-serif}
  #map{width:100%; height:100vh}
  #info{
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.8); color:white;
    padding:12px 16px; border-radius:12px; font-size:14px;
    z-index:10;
  }
</style>
</head>
<body>
<div id="info">🚚 Expedisi Basung 3D<br><small>Ngikutin jalan OSM asli + Gedung 3D</small></div>
<div id="map"></div>
<script>
async function startExpedisi(){
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [100.0285, -0.0645],
    zoom: 16.5,
    pitch: 68,
    bearing: -15,
    antialias: true
  });

  map.on('load', async () => {
    // 1. BIKIN GEDUNG JADI 3D BIAR HIDUP
    map.addLayer({
      id: '3d-buildings',
      source: 'openmaptiles',
      'source-layer': 'building',
      type: 'fill-extrusion',
      minzoom: 14,
      paint: {
        'fill-extrusion-color': '#d0d0d0',
        'fill-extrusion-height': ['case', ['has','height'], ['get','height'], 15],
        'fill-extrusion-base': ['case', ['has','min_height'], ['get','min_height'], 0],
        'fill-extrusion-opacity': 0.85
      }
    });

    // 2. RUTE EKSPEDISI ASLI LUBUK BASUNG (pakai jalan OSM beneran)
    // Gue bikin 3 titik: Pasar - Manggopoh - Kelok 44
    const checkpoints = [
      [100.0278, -0.0628], // Start: Pasar Lubuk Basung
      [100.0335, -0.0735], // Manggopoh
      [100.0412, -0.0820] // Menuju Maninjau
    ];

    let fullRoute = [];
    // Gabungin rute antar checkpoint biar ngikutin jalan aspal
    for(let k=0;k<checkpoints.length-1;k++){
      const url = `https://router.project-osrm.org/route/v1/driving/${checkpoints[k].join(',')};${checkpoints[k+1].join(',')}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const json = await res.json();
      fullRoute = fullRoute.concat(json.routes[0].geometry.coordinates);
    }

    // Gambar jejak jalan nya
    map.addSource('route', {
      type: 'geojson',
      data: {type:'Feature', geometry:{type:'LineString', coordinates: fullRoute}}
    });
    map.addLayer({
      id:'route-line', type:'line', source:'route',
      paint:{'line-color':'#ff6a00','line-width':6,'line-opacity':0.8}
    });

    // 3. MOBIL EKSPEDISI NYA
    const el = document.createElement('div');
    el.innerHTML = '🚚';
    el.style.fontSize = '38px';
    el.style.textShadow = '0 4px 8px black';
    el.style.transition = 'transform 0.2s';
    const mobil = new maplibregl.Marker({element: el, rotationAlignment:'map'})
     .setLngLat(fullRoute[0]).addTo(map);

    // 4. JALAN OTOMATIS NGIKUTIN JALAN OSM
    let i = 0;
    const speed = 3; // makin gede makin ngebut
    setInterval(()=>{
      if(i < fullRoute.length - speed){
        const curr = fullRoute[i];
        const next = fullRoute[i+speed];
        mobil.setLngLat(curr);

        // Kamera ngikut kayak GTA
        map.easeTo({
          center: curr,
          bearing: Math.atan2(next[0]-curr[0], next[1]-curr[1]) * 180 / Math.PI * -1 + 90,
          duration: 400,
          easing: t=>t
        });

        // Putar mobil sesuai belokan
        const angle = Math.atan2(next[1]-curr[1], next[0]-curr[0]) * 180 / Math.PI;
        el.style.transform = `rotate(${angle-90}deg)`;

        i += speed;
        document.getElementById('info').innerHTML = `🚚 Expedisi Basung 3D<br><small>📍 ${i}/${fullRoute.length} | Kecepatan ${speed*10} km/h</small>`;
      } else {
        i = 0; // ulang lagi dari awal
      }
    }, 120);
  });
}
startExpedisi();
</script>
</body>
</html>
