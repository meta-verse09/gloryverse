<!-- SIDEBAR GLORYVERSE - Pure HTML -->
<aside class="gv-sidebar">
  <div class="gv-sidebar-profile">
    <div class="gv-sidebar-avatar" id="gv-avatar">P</div>
    <div class="gv-sidebar-username" id="gv-username">Player</div>
    <div class="gv-sidebar-rank" id="gv-rank">ID • Kadet</div>
    
    <!-- Citizenship & Region Info -->
    <div class="gv-citizenship-info">
      <div class="gv-info-row">
        <span class="gv-info-icon">️</span>
        <span class="gv-info-label">Warga:</span>
        <span class="gv-info-value" id="gv-citizenship">Indonesia</span>
      </div>
      <div class="gv-info-row">
        <span class="gv-info-icon">📍</span>
        <span class="gv-info-label">Domisili:</span>
        <span class="gv-info-value" id="gv-region">Betawi</span>
      </div>
    </div>
  </div>
  
  <div class="gv-sidebar-stats">
    <div class="gv-stat-bar">
      <div class="gv-stat-label">
        <span>⚡ Energy</span>
        <span id="gv-energy-text">100%</span>
      </div>
      <div class="gv-stat-bar-container">
        <div class="gv-stat-bar-fill gv-energy-bar" id="gv-energy-bar" style="width: 100%;">100%</div>
      </div>
    </div>
    
    <div class="gv-stat-bar">
      <div class="gv-stat-label">
        <span>❤️ Health</span>
        <span id="gv-health-text">100%</span>
      </div>
      <div class="gv-stat-bar-container">
        <div class="gv-stat-bar-fill gv-health-bar" id="gv-health-bar" style="width: 100%;">100%</div>
      </div>
    </div>
    
    <div class="gv-stat-bar">
      <div class="gv-stat-label">
        <span>⭐ XP Level</span>
        <span id="gv-xp-text">Level 1</span>
      </div>
      <div class="gv-stat-bar-container">
        <div class="gv-stat-bar-fill gv-xp-bar" id="gv-xp-bar" style="width: 10%;">10%</div>
      </div>
    </div>
  </div>
  
  <div class="gv-currency-section">
    <div class="gv-currency-item">
      <div class="gv-currency-label">
        <span>💶</span>
        <span>Euro</span>
      </div>
      <div class="gv-currency-value" id="gv-euro">0</div>
    </div>
    <div class="gv-currency-item">
      <div class="gv-currency-label">
        <span>💎</span>
        <span>Gold</span>
      </div>
      <div class="gv-currency-value" id="gv-sidebar-gold">0</div>
    </div>
    <div class="gv-currency-item">
      <div class="gv-currency-label">
        <span>🇮🇩</span>
        <span>Currency</span>
      </div>
      <div class="gv-currency-value" id="gv-currency">0</div>
    </div>
  </div>
  
  <div class="gv-sidebar-menu">
    <button class="gv-menu-btn"> Business</button>
    <button class="gv-menu-btn">📦 Collection</button>
    <button class="gv-menu-btn">🤖 Assistant</button>
    <button class="gv-menu-btn">🚗 Garage</button>
    <button class="gv-menu-btn"> Wallet</button>
    <button class="gv-menu-btn">⚔️ Armory</button>
    <button class="gv-menu-btn">🎨 Cosmetics</button>
    <button class="gv-menu-btn">🏠 Housing</button>
    <button class="gv-menu-btn"> Squad</button>
    <button class="gv-menu-btn">🏅 Badges</button>
    <button class="gv-menu-btn"> News</button>
    <button class="gv-menu-btn">🗺️ Area</button>
  </div>
</aside>
