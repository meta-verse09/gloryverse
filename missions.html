<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Misi</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>.pano{display:none}
.m{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#0b1020}
.mbar{height:8px;background:#1b2c55;border-radius:6px;margin:6px 0}
.mbar i{display:block;height:100%;background:var(--gold);border-radius:6px;width:0}
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px}</style>
</head>
<body data-img="region1.jpeg" data-title="Papan Misi">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
 <a href="market.html">MARKETS</a><a href="war.html">WAR</a>
 <a href="org.html">ORGANIZATIONS</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="card"><h3>📜 Papan Misi</h3>
   <small style="color:var(--mut)">Selesaikan tugas, klaim hadiah. Misi harian & misi region menyusul!</small></div>
  <div id="list"></div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
let UID=null,COIN=0;
(async()=>{try{const {data:{session}}=await db.auth.getSession();
 if(session){UID=session.user.id;
  const w=await db.from('wallets').select('*').eq('user_id',UID).single();
  COIN=w.data?.local_coin??0;$('coin').innerText=COIN;$('en').innerText=w.data?.energy??100;
  $('mode').innerText='🟢 MODE ONLINE';}
 else $('mode').innerText='MODE DEMO';
}catch(e){} render();})();
const MS=[
 {id:'m1',ic:'🌱',n:'Panen 3 sayur',d:'Tap petak di kebun Surabaya sampai 3 panen.',t:3,
  g:()=>+localStorage.getItem('gv_m1c')||0,r:20,auto:1},
 {id:'m2',ic:'🌾',n:'Panen malas',d:'Tanam (4 jam) lalu panen sekali — pintu pro!',t:1,
  g:()=>+localStorage.getItem('gv_idle_c')||0,r:10},
 {id:'m3',ic:'🥕',n:'Rajin bertani',d:'Total 10 panen sayur di kebun.',t:10,
  g:()=>+localStorage.getItem('gv_m1c')||0,r:30},
 {id:'m4',ic:'🪙',n:'Kolektor koin',d:'Punya 100 koin di dompet.',t:100,g:()=>COIN,r:15}
];
function render(){const L=$('list');L.innerHTML='';
 MS.forEach(m=>{const p=Math.min(m.g(),m.t),done=p>=m.t,
  cl=localStorage.getItem('gv_cl_'+m.id),
  doneShow=m.auto?localStorage.getItem('gv_m1'):cl;
  const d=document.createElement('div');d.className='m';
  d.innerHTML=`<div class="row"><b>${m.ic} ${m.n}</b>
   <span style="color:var(--gold)">+${m.r} 🪙</span></div>
   <small style="color:var(--mut)">${m.d}</small>
   <div class="mbar"><i style="width:${(p/m.t)*100}%"></i></div>
   <div class="row"><small style="color:var(--mut)">${p}/${m.t}</small>
   ${doneShow?'<b style="color:var(--green)">✅ SELESAI</b>':
    done?`<button class="btn" data-id="${m.id}">KLAIM HADIAH</button>`:
    `<small style="color:var(--mut)">belum selesai</small>`}</div>`;
  L.appendChild(d);});
 L.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>claim(b.dataset.id));}
function claim(id){const m=MS.find(x=>x.id===id);if(!m)return;
 if(!UID){alert('Login dulu buat klaim hadiah!');return}
 localStorage.setItem('gv_cl_'+id,'1');COIN+=m.r;$('coin').innerText=COIN;
 db.rpc('work_once',{uid:UID,coin:m.r,en:0}).catch(()=>{});render();}
</script>
</body></html>
