<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Market</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3008754794200206" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px;align-items:center}
.dim{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{background:#0b1020;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:bold;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold);background:#1b2c55}
.kios{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0b102066;margin-bottom:8px}
input,select{background:#0b1020;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;width:90px}
</style>
</head>
<body data-img='region1.jpeg' data-title="Market">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
 <a class="on" href="market.html">MARKETS</a><a href="war.html">WAR</a>
 <a href="org.html">ORGANIZATIONS</a><a href="mapverse.html">MAPVERSE</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="tabs">
   <button class="tab on" id="tLok">🏪 LOKAL</button>
   <button class="tab" id="tGlob">🌍 GLOBAL</button>
   <button class="tab" id="tB2B">🤝 B2B</button>
  </div>
  <div class="card">
   <h3>🏪 Buka Kios (Tier 3)</h3>
   <div class="row"><span>Produk</span><select id="kProd">
    <option>Nasi Ransum</option><option>Kopi Susu</option><option>Kemeja Batik</option></select></div>
   <div class="row"><span>Harga</span><input id="kPrice" type="number" value="5"></div>
   <div class="row"><span>Stok</span><input id="kStock" type="number" value="5"></div>
   <button class="btn" id="kBtn" style="width:100%">PASANG DAGANGAN</button>
   <small class="dim">Nasi Ransum ← Warung Makan • Kopi Susu ← Kedai Kopi • Kemeja Batik ← Toko Kain. (T1/T2 = B2B, bukan di sini.)</small>
  </div>
  <div class="card"><h3 id="listTitle">🏪 Kios Lokal</h3><div id="kiosList" class="dim">memuat...</div></div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
let MODE='lok';
const EMO={'Nasi Ransum':'🍱','Kopi Susu':'🥤','Kemeja Batik':'👕'};
const CURR=localStorage.getItem('gv_region')||'Solok';
$('tLok').onclick=()=>{MODE='lok';setTab();load()};
$('tGlob').onclick=()=>{MODE='glob';setTab();load()};
$('tB2B').onclick=()=>alert('🤝 Pasar B2B (Tier 1 & 2) segera hadir — jual-beli RAW antar perusahaan.');
function setTab(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 $(MODE==='lok'?'tLok':'tGlob').classList.add('on');
 $('listTitle').innerText=MODE==='lok'?'🏪 Kios Lokal — '+CURR:'🌍 Kios Global';}
async function load(){try{
 let q=db.from('listings').select('*').order('id',{ascending:false}).limit(50);
 if(MODE==='lok')q=q.eq('region',CURR);
 const {data}=await q;
 $('kiosList').innerHTML=(data&&data.length)?data.map(x=>`
  <div class="kios">
   <div class="row"><span>${EMO[x.product]||'📦'} <b>${x.product}</b></span><b style="color:var(--gold)">${x.price} 🪙</b></div>
   <div class="row dim"><span>🧑‍ ${x.seller_name} • ${x.region}</span><span>stok ${x.stock}</span></div>
   <button class="btn" style="width:100%" data-id="${x.id}" ${x.stock<=0?'disabled':''}>BELI</button>
  </div>`).join('')
  :'<span class="dim">Belum ada kios di sini — jadilah pedagang pertama!</span>';
 document.querySelectorAll('#kiosList [data-id]').forEach(b=>b.onclick=async()=>{try{
  const {data:{session}}=await db.auth.getSession();if(!session){alert('Login dulu!');return}
  const r=await db.rpc('buy_item',{p_uid:session.user.id,p_listing:+b.dataset.id});const res=r.data||{};
  if(res.ok){alert('✅ Pembelian berhasil!');load();
   const w=await db.from('wallets').select('local_coin').eq('user_id',session.user.id).single();
   $('coin').innerText=w.data?.local_coin??0;}
  else alert('Gagal: '+res.err);
 }catch(e){alert('Gagal: '+String(e&&e.message||e))}});
}catch(e){$('kiosList').innerText='Memuat gagal...'}}
load();
$('kBtn').onclick=async()=>{try{
 const {data:{session}}=await db.auth.getSession();if(!session){alert('Login dulu!');return}
 const r=await db.rpc('list_item',{p_uid:session.user.id,p_product:$('kProd').value,
  p_price:Math.max(1,+$('kPrice').value||1),p_stock:Math.max(1,+$('kStock').value||1)});
 const res=r.data||{};
 if(res.ok){alert('🏪 Kios dibuka!');load()}else alert('Gagal: '+res.err);
}catch(e){alert('Gagal: '+String(e&&e.message||e))}};
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(!session){$('mode').innerText='MODE DEMO';return}
 $('mode').innerText='🟢 MODE ONLINE';
 const w=await db.from('wallets').select('local_coin').eq('user_id',session.user.id).single();
 $('coin').innerText=w.data?.local_coin??0;}catch(e){}})();
</script>
</body></html>
