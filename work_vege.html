<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Kebun Sayur</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3008754794200206" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>
#game{position:relative;height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--gold);
 background:url('kb_bg.jpeg') center/cover}
.tom{position:absolute;width:72px;cursor:pointer;transition:transform .1s;filter:drop-shadow(0 3px 4px #0007)}
.tom:active{transform:scale(.85)}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;
 font-weight:900;color:#fff;text-shadow:0 2px 4px #000;font-size:18px;z-index:5}
#hud img{width:26px;vertical-align:-6px}
#ov{position:absolute;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:10px;color:#fff;text-align:center;z-index:9}
</style>
</head>
<body data-img='pano_vege.jpeg' data-title="Kebun Surabaya">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
 <a href="market.html">MARKETS</a><a href="war.html">WAR</a>
 <a href="org.html">ORGANIZATIONS</a><a href="mapverse.html">MAPVERSE</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="card">
   <h3>🌱 Kebun Sayur — Minigame Panen</h3>
   <p class="dim" style="font-size:13px">Ketuk tomat secepat mungkin! 30 detik • 1 tomat = 1 🪙 saat klaim.</p>
   <div id="game">
    <div id="hud"><span><img src="kb_keranjang.png"> <b id="scrN">0</b></span><span>⏱ <b id="tmr">30</b></span></div>
    <div id="ov"><h2 id="ovT">🌱 SIAP PANEN?</h2><button class="btn" id="ovB">MULAI</button></div>
   </div>
  </div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
const SPOTS=[[20,52],[33,47],[44,58],[27,68],[40,74],[18,70],[47,45]];
let skor=0,sisa=30,run=false,iv=null;
function spawn(i){const t=document.createElement('img');t.src='kb_tomat.png';t.className='tom';
 const s=SPOTS[i%SPOTS.length];t.style.left=s[0]+'%';t.style.top=s[1]+'%';
 t.onclick=()=>{if(!run)return;skor++;$('scrN').innerText=skor;t.style.display='none';
  setTimeout(()=>{const s2=SPOTS[Math.floor(Math.random()*SPOTS.length)];
   t.style.left=s2[0]+'%';t.style.top=s2[1]+'%';t.style.display='block'},2000)};
 $('game').appendChild(t)}
for(let i=0;i<5;i++)spawn(i);
$('ovB').onclick=()=>{$('ov').style.display='none';run=true;skor=0;sisa=30;
 $('scrN').innerText=0;$('tmr').innerText=30;
 iv=setInterval(()=>{sisa--;$('tmr').innerText=sisa;if(sisa<=0)end()},1000)};
function end(){run=false;clearInterval(iv);$('ov').style.display='flex';
 $('ovT').innerText='⏰ WAKTU HABIS! Panen: '+skor;
 $('ovB').innerText='KLAIM '+skor+' 🪙';$('ovB').onclick=klaim}
async function klaim(){try{
 const {data:{session}}=await db.auth.getSession();
 if(!session){alert('Login dulu untuk klaim!');return}
 await db.rpc('work_once',{uid:session.user.id,coin:skor,en:0});
 $('ovB').innerText='✅ '+skor+' 🪙 MASUK DOMPET';$('ovB').disabled=true;
 const w=await db.from('wallets').select('local_coin').eq('user_id',session.user.id).single();
 $('coin').innerText=w.data?.local_coin??0;
}catch(e){alert('Gagal klaim: '+String(e&&e.message||e))}}
</script>
</body></html>
