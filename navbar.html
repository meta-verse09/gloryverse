  .gv-navbar-brand img {

    border-top: 1px solid rgba(255,255,255,0.1);
  }
  
  .gv-nav-btn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  
  .gv-nav-btn:hover, .gv-nav-btn.active {
    background: #f0c040;
    color: #1a1a2e;
  }
  
  .gv-account-btn {
    background: #f0c040;

<nav class="gv-navbar">
  <div class="gv-navbar-brand">
    <img src="logo.png" alt="GV">
    <h1>GLORYVERSE.ID</h1>
  </div>
  
  <div class="gv-navbar-stats">
    <div class="gv-stat-item">
      <span>🕐</span>
      <span class="value" id="gv-clock">--:--:--</span>
    </div>
    <div class="gv-stat-item">
      <span>☀️</span>
      <span>Cerah</span>
    </div>
    <div class="gv-stat-item">
      <span>💎</span>
      <span class="value" id="gv-gold">0</span>
    </div>
    <div class="gv-stat-item">
      <span>⚡</span>
      <span class="value" id="gv-energy">0</span>
    </div>
    <button class="gv-mode-btn" onclick="toggleMode()">🟢 MODE ONLINE</button>
  </div>
  
  <div class="gv-nav-menu">
    <button class="gv-nav-btn active" onclick="location.href='home-new.html'">HOME</button>
    <button class="gv-nav-btn" onclick="location.href='activities.html'">ACTIVITIES</button>
    <button class="gv-nav-btn" onclick="location.href='markets.html'">MARKETS</button>

    <button class="gv-account-btn">👤 AKUN</button>
  </div>
</nav>

<script>
// Jam real-time
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const el = document.getElementById('gv-clock');
  if (el) el.textContent = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

// Toggle mode
function toggleMode() {
  const btn = event.target;
  if (btn.textContent.includes('ONLINE')) {
    btn.textContent = '🔴 MODE OFFLINE';
    btn.style.background = '#dc3545';
  } else {
    btn.textContent = '🟢 MODE ONLINE';
    btn.style.background = '#28a745';
  }
}
</script>
