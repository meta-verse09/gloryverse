<form id="loginForm">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">LOGIN</button>
</form>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  // Cek sederhana - nanti ganti dengan data player lu
  if (username && password) {
    // Simpan status login
    localStorage.setItem('gloryverse_player', username);
    localStorage.setItem('isLoggedIn', 'true');

    // Langsung lempar ke dashboard
    window.location.href = 'dashboard.html';
    // Kalau domain beda, pakai yang ini:
    // window.location.href = 'https://gloryverse.id/dashboard.html';
  } else {
    alert('Isi dulu username & password!');
  }
});
</script>
