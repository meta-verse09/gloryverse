
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glory Verse - Masuk &amp; Daftar</title>
<meta name="description" content="Gerbang Masuk dan Pendaftaran Akun Pemain Glory Verse - Online Strategy Browser Game">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/touch-icon.png">

<!-- Google Fonts: Roboto Slab & Roboto (Sesuai tema Glory Verse) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,700|Roboto:400,500,700">
<!-- FontAwesome 6 CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --navy-deep: #080d16;
    --navy: #0e1726;
    --panel: #152136;
    --panel-inner: #10192b;
    --border: #283c5f;
    --gold: #d4a64a;
    --gold-bright: #f0c04a;
    --gold-hover: #bc8d33;
    --text: #eef2fa;
    --muted: #9aa9c4;
    --err: #ff6b6b;
    --err-bg: rgba(255, 107, 107, 0.14);
    --ok: #51cf66;
    --ok-bg: rgba(81, 207, 102, 0.14);
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(circle at 50% 15%, rgba(36, 62, 107, 0.55) 0%, transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--text);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
  }

  .auth-card {
    width: 100%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--gold);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
  }

  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .brand-logo {
    display: inline-block;
    max-width: 156px;
    height: auto;
    margin-bottom: 8px;
  }

  .brand-title {
    font-family: "Roboto Slab", Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold-bright);
    margin: 0 0 6px;
    letter-spacing: 0.4px;
  }

  .sub-title {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  .status-init {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 13.5px;
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.25);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    vertical-align: middle;
  }

  .status-init .spinner {
    width: 28px;
    height: 28px;
    border-width: 3px;
    color: var(--gold-bright);
    margin-bottom: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    margin: 18px 0 20px;
  }

  .tabs button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 10px 12px;
    font-family: "Roboto Slab", Georgia, serif;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .tabs button:hover:not(.on) {
    color: var(--text);
  }

  .tabs button.on {
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
    color: #101622;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.45px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap > i {
    position: absolute;
    left: 13px;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .input-wrap input {
    width: 100%;
    padding: 11px 12px 11px 38px;
    font-size: 14.5px;
    color: var(--text);
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap input::placeholder {
    color: #637391;
  }

  .input-wrap input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 166, 74, 0.22);
  }

  .btn-submit {
    width: 100%;
    margin-top: 6px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
    color: #101622;
    font-family: "Roboto Slab", Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: filter 0.15s, transform 0.1s;
  }

  .btn-submit:hover:not(:disabled) {
    filter: brightness(1.06);
  }

  .btn-submit:active:not(:disabled) {
    transform: translateY(1px);
  }

  .btn-submit:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    margin: 18px 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid var(--border);
  }

  .divider span {
    padding: 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .btn-google {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d5dbe5;
    border-radius: 8px;
    background: #ffffff;
    color: #20293a;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s;
  }

  .btn-google:hover:not(:disabled) {
    background: #f1f4f9;
  }

  .btn-google:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .links-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    font-size: 13px;
  }

  .link-btn {
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    font-size: 13px;
    font-family: inherit;
    text-decoration: none;
  }

  .link-btn:hover {
    color: var(--gold-bright);
    text-decoration: underline;
  }

  .msg-box {
    margin-top: 15px;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.45;
    display: none;
  }

  .msg-box.err {
    display: block;
    background: var(--err-bg);
    border: 1px solid var(--err);
    color: #ff9c9c;
  }

  .msg-box.ok {
    display: block;
    background: var(--ok-bg);
    border: 1px solid var(--ok);
    color: #8ee59d;
  }

  .hide {
    display: none !important;
  }

  .card-footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .card-footer a {
    color: var(--muted);
    text-decoration: none;
  }

  .card-footer a:hover {
    color: var(--gold-bright);
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 12px;
    }
    .auth-card {
      padding: 22px 16px 20px;
    }
    .brand-title {
      font-size: 22px;
    }
    .tabs button {
      font-size: 13px;
      padding: 9px 8px;
    }
  }
</style>
</head>
<body>

<main class="auth-card">
  <div class="brand-header">
    <a href="/index.html">
      <img src="/img/logo-site.png" alt="Glory Verse" class="brand-logo" onerror="this.style.display='none'">
    </a>
    <h1 class="brand-title">Glory Verse</h1>
    <p class="sub-title" id="sub-title">Menghubungkan ke layanan autentikasi…</p>
  </div>

  <!-- Loading Check Session -->
  <div id="init-status" class="status-init">
    <div class="spinner"></div>
    <div>Memeriksa status login akun Anda…</div>
  </div>

  <!-- Login & Register Form -->
  <div id="auth-box" class="hide">
    <div class="tabs" role="tablist" aria-label="Pilih mode autentikasi">
      <button type="button" id="tab-login" class="on" role="tab" aria-selected="true">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
      <button type="button" id="tab-register" role="tab" aria-selected="false">
        <i class="fa-solid fa-user-plus"></i> Daftar
      </button>
    </div>

    <form id="auth-form" novalidate autocomplete="on">
      <div class="form-group hide" id="group-username">
        <label for="username">Nama Karakter / Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input id="username" name="username" type="text" autocomplete="nickname" placeholder="Nama karakter Anda di game" maxlength="30">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Alamat Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter" required>
        </div>
      </div>

      <div class="form-group hide" id="confirm-wrap">
        <label for="confirm-password">Konfirmasi Kata Sandi</label>
        <div class="input-wrap">
          <i class="fa-solid fa-shield-halved"></i>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Ketik ulang kata sandi">
        </div>
      </div>

      <button class="btn-submit" id="submit-btn" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
      </button>
    </form>

    <div class="divider"><span>Atau</span></div>

    <button type="button" class="btn-google" id="btn-google">
      <img width="18" height="18" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      <span>Lanjutkan dengan Google</span>
    </button>

    <div class="links-row">
      <button class="link-btn" id="btn-forgot" type="button">Lupa kata sandi?</button>
      <a href="/index.html" class="link-btn">&larr; Kembali ke Beranda</a>
    </div>

    <div class="msg-box" id="msg-box" role="alert" aria-live="polite"></div>
  </div>
</main>

<footer class="card-footer">
  &copy; 2026 Glory Verse &bull; <a href="/privacy_policy.html">Privasi</a> &bull; <a href="/tos.html">Ketentuan</a>
</footer>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import {
  getAuth,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile
} from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  getDocFromServer
} from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

const DASHBOARD_URL = '/dashboard.html';

const firebaseConfig = {
  projectId: "gen-lang-client-0514427323",
  appId: "1:16121083015:web:3d017df91f8ec727fcf422",
  apiKey: "AIzaSyAt3OUy0y-K_oNC2KDtIBcXPSujqubxzIc",
  authDomain: "gen-lang-client-0514427323.firebaseapp.com",
  firestoreDatabaseId: "ai-studio-gloryverse-0730533f-7a64-4d8a-ae24-862b182ccd86",
  storageBucket: "gen-lang-client-0514427323.firebasestorage.app",
  messagingSenderId: "16121083015",
  measurementId: "",
  oAuthClientId: "16121083015-8cap9l3knpnie8g4hfnapn4qh970sjt4.apps.googleusercontent.com",
  recaptchaSiteKey: ""
};

const OperationType = {
  CREATE: 'create',
  UPDATE: 'update',
  DELETE: 'delete',
  LIST: 'list',
  GET: 'get',
  WRITE: 'write'
};

let app = null;
let db = null;
let auth = null;
let currentMode = 'login';
let isSubmittingAuth = false;

const initStatus = document.getElementById('init-status');
const authBox = document.getElementById('auth-box');
const subTitle = document.getElementById('sub-title');
const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const authForm = document.getElementById('auth-form');
const groupUsername = document.getElementById('group-username');
const confirmWrap = document.getElementById('confirm-wrap');
const submitBtn = document.getElementById('submit-btn');
const btnGoogle = document.getElementById('btn-google');
const btnForgot = document.getElementById('btn-forgot');
const msgBox = document.getElementById('msg-box');

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showMsg(text, type = 'err') {
  if (!msgBox) return;
  if (!text) {
    msgBox.className = 'msg-box';
    msgBox.textContent = '';
    return;
  }
  msgBox.textContent = text;
  msgBox.className = `msg-box ${type}`;
}

function setSubmitButtonIdle() {
  if (!submitBtn) return;
  submitBtn.disabled = false;
  submitBtn.innerHTML = currentMode === 'register'
    ? '<i class="fa-solid fa-user-plus"></i> Buat Akun Baru'
    : '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
}

function setMode(mode) {
  currentMode = mode === 'register' ? 'register' : 'login';
  const isRegister = currentMode === 'register';

  if (tabLogin) {
    tabLogin.classList.toggle('on', !isRegister);
    tabLogin.setAttribute('aria-selected', String(!isRegister));
  }
  if (tabRegister) {
    tabRegister.classList.toggle('on', isRegister);
    tabRegister.setAttribute('aria-selected', String(isRegister));
  }
  if (groupUsername) groupUsername.classList.toggle('hide', !isRegister);
  if (confirmWrap) confirmWrap.classList.toggle('hide', !isRegister);
  if (btnForgot) btnForgot.classList.toggle('hide', isRegister);

  const pwdInput = document.getElementById('password');
  if (pwdInput) {
    pwdInput.autocomplete = isRegister ? 'new-password' : 'current-password';
  }

  if (subTitle) {
    subTitle.textContent = isRegister
      ? 'Buat akun pemain baru untuk bergabung ke Glory Verse.'
      : 'Masuk ke akun Anda untuk melanjutkan ke dashboard.';
  }

  setSubmitButtonIdle();
  showMsg('');
}

function redirectToDashboard() {
  window.location.replace(DASHBOARD_URL);
}

function handleFirestoreError(error, operationType, path) {
  const user = auth && auth.currentUser ? auth.currentUser : null;
  const errInfo = {
    error: error instanceof Error ? error.message : String(error),
    authInfo: {
      userId: user ? user.uid : null,
      email: user ? user.email : null,
      emailVerified: user ? user.emailVerified : null,
      isAnonymous: user ? user.isAnonymous : null,
      tenantId: user ? user.tenantId : null,
      providerInfo: user && Array.isArray(user.providerData)
        ? user.providerData.map((p) => ({ providerId: p.providerId, email: p.email }))
        : []
    },
    operationType,
    path
  };
  console.warn('Firestore Error:', JSON.stringify(errInfo));
}

async function ensureUserProfile(user, preferredUsername = '') {
  if (!user || !db) return;
  const path = `users/${user.uid}`;
  try {
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
      const fallbackName = user.email ? user.email.split('@')[0] : 'Pemain';
      const cleanName = (preferredUsername || user.displayName || fallbackName || 'Pemain').trim().slice(0, 50) || 'Pemain';
      const nowIso = new Date().toISOString();

      await setDoc(userRef, {
        id: user.uid,
        username: cleanName,
        email: (user.email || '').slice(0, 128),
        country_code: 'ID',
        country_name: 'Indonesia',
        region_name: 'Jakarta',
        level: 1,
        xp: 0,
        energy: 100,
        health: 100,
        gold: 10,
        euro: 0,
        svct: 0,
        currency: 0,
        income: 0,
        alerts: 0,
        messages: 0,
        work_bonus: 0,
        created_at: nowIso,
        updated_at: nowIso
      });
    }
  } catch (err) {
    handleFirestoreError(err, OperationType.WRITE, path);
  }
}

function translateFirebaseError(err) {
  const code = (err && err.code) || '';
  switch (code) {
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
      return 'Email atau kata sandi salah. Silakan periksa kembali kata sandi Anda.';
    case 'auth/user-not-found':
      return 'Akun dengan email tersebut belum terdaftar. Silakan pilih tab Daftar.';
    case 'auth/email-already-in-use':
      return 'Email ini sudah terdaftar. Silakan pindah ke tab Masuk untuk login.';
    case 'auth/weak-password':
      return 'Kata sandi terlalu lemah. Gunakan minimal 6 karakter.';
    case 'auth/invalid-email':
      return 'Format alamat email tidak valid.';
    case 'auth/user-disabled':
      return 'Akun ini sedang dinonaktifkan.';
    case 'auth/too-many-requests':
      return 'Terlalu banyak percobaan login gagal. Silakan tunggu beberapa menit atau gunakan fitur Lupa kata sandi.';
    case 'auth/popup-closed-by-user':
    case 'auth/cancelled-popup-request':
      return 'Popup login Google ditutup sebelum proses selesai.';
    case 'auth/popup-blocked':
      return 'Popup login diblokir oleh browser. Izinkan popup untuk situs ini lalu coba lagi.';
    case 'auth/network-request-failed':
      return 'Koneksi jaringan bermasalah. Periksa internet Anda dan coba lagi.';
    case 'auth/operation-not-allowed':
      return 'Metode login ini belum diaktifkan di konsol Firebase.';
    default:
      return (err && err.message) ? err.message : 'Terjadi kesalahan autentikasi. Silakan coba lagi.';
  }
}

async function testConnection() {
  try {
    await getDocFromServer(doc(db, 'test', 'connection'));
  } catch (err) {
    if (err instanceof Error && err.message.includes('the client is offline')) {
      console.warn('Firebase client is offline. Periksa konfigurasi Firebase.');
    }
  }
}

function wireUIEvents() {
  if (tabLogin) tabLogin.addEventListener('click', () => setMode('login'));
  if (tabRegister) tabRegister.addEventListener('click', () => setMode('register'));

  if (authForm) {
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!auth) {
        showMsg('Layanan autentikasi belum siap. Muat ulang halaman.', 'err');
        return;
      }

      const emailEl = document.getElementById('email');
      const passEl = document.getElementById('password');
      const userEl = document.getElementById('username');
      const confirmEl = document.getElementById('confirm-password');

      const email = emailEl ? emailEl.value.trim() : '';
      const password = passEl ? passEl.value : '';
      const username = userEl ? userEl.value.trim() : '';
      const confirmPassword = confirmEl ? confirmEl.value : '';

      if (!email) {
        showMsg('Alamat email wajib diisi.', 'err');
        return;
      }
      if (!password) {
        showMsg('Kata sandi wajib diisi.', 'err');
        return;
      }

      if (currentMode === 'register') {
        if (password.length < 6) {
          showMsg('Kata sandi minimal harus 6 karakter.', 'err');
          return;
        }
        if (password !== confirmPassword) {
          showMsg('Konfirmasi kata sandi tidak cocok.', 'err');
          return;
        }
      }

      isSubmittingAuth = true;
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Memproses...';
      }
      showMsg('');

      try {
        if (currentMode === 'login') {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          await ensureUserProfile(cred.user);
          showMsg('Login berhasil! Mengalihkan ke dashboard…', 'ok');
          redirectToDashboard();
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (username) {
            try {
              await updateProfile(cred.user, { displayName: username.slice(0, 50) });
            } catch (profileErr) {
              console.warn('Update displayName skipped:', profileErr);
            }
          }
          await ensureUserProfile(cred.user, username);
          showMsg('Pendaftaran berhasil! Mengalihkan ke dashboard…', 'ok');
          redirectToDashboard();
        }
      } catch (err) {
        isSubmittingAuth = false;
        showMsg(translateFirebaseError(err), 'err');
        setSubmitButtonIdle();
      }
    });
  }

  if (btnGoogle) {
    btnGoogle.addEventListener('click', async () => {
      if (!auth) {
        showMsg('Layanan autentikasi belum siap. Muat ulang halaman.', 'err');
        return;
      }
      isSubmittingAuth = true;
      btnGoogle.disabled = true;
      showMsg('');
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await ensureUserProfile(cred.user);
        showMsg('Login Google berhasil! Mengalihkan ke dashboard…', 'ok');
        redirectToDashboard();
      } catch (err) {
        isSubmittingAuth = false;
        showMsg(translateFirebaseError(err), 'err');
        btnGoogle.disabled = false;
      }
    });
  }

  if (btnForgot) {
    btnForgot.addEventListener('click', async () => {
      if (!auth) return;
      const emailEl = document.getElementById('email');
      const email = emailEl ? emailEl.value.trim() : '';
      if (!email) {
        showMsg('Masukkan alamat email Anda terlebih dahulu, lalu klik Lupa kata sandi.', 'err');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg('Tautan reset kata sandi telah dikirim ke email Anda. Periksa inbox atau folder spam.', 'ok');
      } catch (err) {
        showMsg(translateFirebaseError(err), 'err');
      }
    });
  }
}

async function initAuthGateway() {
  try {
    app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
    auth = getAuth(app);

    wireUIEvents();
    testConnection();

    const params = new URLSearchParams(window.location.search);
    const requestedMode = params.get('mode') === 'register' ? 'register' : 'login';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!isSubmittingAuth) {
          if (initStatus) {
            initStatus.innerHTML = '<div class="spinner"></div><div>Akun sudah aktif. Mengalihkan ke dashboard…</div>';
          }
          redirectToDashboard();
        }
        return;
      }

      if (initStatus) initStatus.classList.add('hide');
      if (authBox) authBox.classList.remove('hide');
      setMode(requestedMode);
    });
  } catch (err) {
    console.error('Inisialisasi Firebase gagal:', err);
    if (initStatus) {
      initStatus.innerHTML = `
        <div style="color: var(--err); margin-bottom: 8px;">
          <i class="fa-solid fa-triangle-exclamation"></i> Gagal menghubungkan layanan autentikasi: ${escapeHtml(err && err.message ? err.message : String(err))}
        </div>
        <small style="color: var(--muted);">Silakan muat ulang halaman ini.</small>
      `;
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAuthGateway);
} else {
  initAuthGateway();
}
</script>
