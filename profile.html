<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse - Profile</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="layout.css">
<style>
.profile-container{max-width:600px;margin:20px auto;padding:20px}
.profile-header{text-align:center;margin-bottom:30px}
.avatar-preview{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);margin:0 auto 15px;overflow:hidden;background:var(--bg2);position:relative}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-preview .default-avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold;color:var(--gold);background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.username{font-size:24px;font-weight:bold;color:var(--gold);margin:10px 0}
.username-label{color:var(--mut);font-size:12px}
.section-title{font-size:18px;font-weight:bold;margin:25px 0 15px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px}
.upload-area{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;margin-bottom:20px;cursor:pointer;transition:all 0.2s}
.upload-area:hover{border-color:var(--gold);background:var(--bg2)}
.upload-area.has-file{border-color:var(--green);border-style:solid}
.upload-icon{font-size:48px;margin-bottom:10px}
.upload-text{color:var(--txt);margin-bottom:8px}
.upload-hint{color:var(--mut);font-size:12px}
#fileInput{display:none}
.btn-save{width:100%;padding:14px;font-size:16px;margin-top:20px}
.btn-remove{width:100%;padding:12px;margin-top:10px;background:#dc2626;border:none;color:white;border-radius:8px;cursor:pointer;font-weight:bold}
.btn-remove:hover{background:#b91c1c}
.current-info{background:var(--bg2);padding:15px;border-radius:10px;margin-bottom:20px}
.info-row{display:flex;justify-content:space-between;margin:8px 0}
.info-label{color:var(--mut)}
.info-value{font-weight:bold}
.preview-container{margin:20px 0;text-align:center}
.preview-label{color:var(--mut);margin-bottom:10px;font-size:14px}
</style>
</head>
<body data-img='reg_solok.jpeg' data-title="Profile">
<header><b class="logo">GloryVerse</b>
<span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr"></span>
<span class="chip"><b id="coin">0</b></span><span class="chip"><b id="en">100</b></span>
<span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
<a href="market.html">MARKETS</a><a href="war.html">WAR</a>
<a href="org.html">ORGANIZATIONS</a><a href="mapverse.html">MAPVERSE</a><a href="rank.html">RANKINGS</a>
<a class="on" href="profile.html">PROFILE</a></nav>

<div class="profile-container">
  <div class="profile-header">
    <div class="avatar-preview" id="currentAvatar">
      <div class="default-avatar" id="defaultAvatar"></div>
      <img src="" alt="Avatar" id="previewImg" style="display:none">
    </div>
    <div class="username" id="displayUsername">Loading...</div>
    <div class="username-label">Username (tidak dapat diubah)</div>
  </div>

  <div class="current-info">
    <div class="info-row">
      <span class="info-label">Level</span>
      <span class="info-value" id="userLevel">1</span>
    </div>
    <div class="info-row">
      <span class="info-label">Coin</span>
      <span class="info-value" id="userCoin">0</span>
    </div>
    <div class="info-row">
      <span class="info-label">Energy</span>
      <span class="info-value" id="userEnergy">100</span>
    </div>
  </div>

  <div class="section-title">Upload Avatar Custom</div>
  
  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📤</div>
    <div class="upload-text">Klik untuk upload avatar</div>
    <div class="upload-hint">Max 2MB (JPG, PNG)</div>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png">

  <div class="preview-container" id="previewContainer" style="display:none">
    <div class="preview-label">Preview:</div>
    <div class="avatar-preview" style="margin:0 auto">
      <img src="" id="uploadPreview">
    </div>
  </div>

  <button class="btn btn-save" id="btnSave">SIMPAN AVATAR</button>
  <button class="btn-remove" id="btnRemove" style="display:none">HAPUS AVATAR CUSTOM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="profile.js"></script>
</body>
</html>
