<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Collection</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3008754794200206" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px}
.big{font-size:22px;font-weight:900}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--gold)}
.dim{color:var(--mut);font-size:12px}
.plus{color:var(--green);font-weight:800}.min{color:#f87171;font-weight:800}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{background:#0b1020;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:bold;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold);background:#1b2c55}
</style>
</head>
<body data-img='region1.jpeg' data-title="Collection">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
 <a class="on" href="market.html">MARKETS</a><a href="war.html">WAR</a>
 <a href="org.html">ORGANIZATIONS</a><a href="mapverse.html">MAPVERSE</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="card">
   <h3>📦 Collection — Arus Uang</h3>
   <div class="row"><span>📈 Total Masuk</span><b class="big plus" id="sumIn">+0</b></div>
   <div class="row"><span>📉 Total Keluar</span><b class="big min" id="sumOut">-0</b></div>
   <div class="row"><span>💼 Saldo</span><b class="big" style="color:var(--gold)" id="bal">0</b></div>
  </div>
  <div class="tabs" id="tabs">
   <button class="tab on" data-f="all">Semua</button>
   <button class="tab" data-f="in">Masuk</button>
   <button class="tab" data-f="out">Keluar</button>
  </div>
  <div class="card"><table class="tbl" id="txTbl"><tr><th>Keterangan</th><th>Jumlah</th><th>Waktu</th></tr></table></div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
let TX=[],F='all';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{F=b.dataset.f;
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()});
function draw(){
 const tin=TX.filter(x=>x.a>0).reduce((s,x)=>s+x.a,0);
 const tout=TX.filter(x=>x.a<=0).reduce((s,x)=>s-x.a,0);
 $('sumIn').innerText='+'+tin;$('sumOut').innerText='-'+tout;
 const list=TX.filter(x=>F==='all'||(F==='in'?x.a>0:x.a<=0));
 $('txTbl').innerHTML='<tr><th>Keterangan</th><th>Jumlah</th><th>Waktu</th></tr>'+
 (list.length?list.map(x=>`<tr><td>${x.d}</td><td class="${x.a>=0?'plus':'min'}">${x.a>=0?'+':''}${x.a} ${x.c}</td><td class="dim">${ago(x.t)}</td></tr>`).join('')
 :'<tr><td colspan="3" class="dim">Belum ada transaksi pada filter ini.</td></tr>');}
(async()=>{try{const {data:{session}}=await db.auth.getSession();
 if(!session){$('mode').innerText='MODE DEMO';return}
 $('mode').innerText='🟢 MODE ONLINE';
 const w=await db.from('wallets').select('local_coin').eq('user_id',session.user.id).single();
 $('bal').innerText=w.data?.local_coin??0;$('coin').innerText=w.data?.local_coin??0;
 const {data}=await db.from('transactions').select('*').order('id',{ascending:false}).limit(100);
 TX=(data||[]).map(x=>({d:x.description||x.type||'Transaksi',a:+(x.amount??0),c:x.currency||'🪙',t:x.created_at}));
 draw();
}catch(e){$('mode').innerText='MODE DEMO';draw()}})();
</script>
</body></html>
