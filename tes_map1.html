
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - GloryVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { dark: '#0B0F19', card: '#151B2B', accent: '#F59E0B' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Dark Mode Map Trick */
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .hillshade-layer .leaflet-tile { filter: none !important; opacity: 0.5; }
        .earthquake-layer .leaflet-tile { filter: none !important; }

        /* Animations */
        @keyframes pulse-alert { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .disaster-icon { font-size: 28px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); animation: pulse-alert 1.5s infinite; background: transparent; border: none; }

        /* Layout Sizing */
        #map { height: calc(100vh - 180px); width: 100%; z-index: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal Styling */
        .modal-overlay { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-brand-dark text-slate-200 font-sans overflow-x-hidden">

    <!-- 1. TOPBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 px-4 py-2 flex justify-between items-center shadow-lg h-14">
        <!-- Kiri: Jam London -->
        <div class="flex items-center gap-2 text-xs font-semibold text-blue-300 bg-slate-800 px-2 py-1 rounded-full border border-slate-700">
            <span>🇬🇧</span> <span id="london-clock">Loading...</span>
        </div>

        <!-- Tengah: 3 Mata Uang -->
        <div class="flex items-center gap-3 text-xs font-bold">
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-purple-400">
                <span>💎</span> <span id="stat-diamond">0</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-yellow-400">
                <span>💰</span> <span id="stat-gold">0</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-blue-400">
                <span>🪙</span> <span id="stat-currency">0</span>
            </div>
        </div>

        <!-- Kanan: Logo & Wallet -->
        <div class="flex items-center gap-3">
            <img src="https://gloryverse.id/img/logo-site.png" alt="GloryVerse Logo" class="h-8 w-auto object-contain">
            <button id="wallet-btn" onclick="connectWallet()" class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                👻 Connect
            </button>
        </div>
    </nav>

    <!-- 2. MENU BAR (SIMPLE) -->
    <div class="fixed top-14 left-0 right-0 z-40 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 h-10">
        <div class="max-w-7xl mx-auto flex items-center justify-center gap-2 h-full px-4">
            <button onclick="showSection('dashboard')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">🗺️ Dashboard</button>
            <button onclick="showSection('profile')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">👤 Profile</button>
            <button onclick="showSection('event')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">🎉 Event</button>
        </div>
    </div>

    <!-- 3. MAIN CONTENT: FULLSCREEN MAP -->
    <div class="pt-24 pb-24 min-h-screen">
        <div id="map" class="w-full"></div>
    </div>

    <!-- 4. BOTTOM NATIVE ADSTERRA -->
    <div class="fixed bottom-8 left-0 right-0 z-30 px-4">
        <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-700 rounded-xl p-2 max-w-2xl mx-auto">
            <p class="text-slate-500 text-[10px] text-center mb-1">Advertisement</p>
            <div class="flex justify-center min-h-[90px] items-center overflow-hidden">
                <script async="async" data-cfasync="false" src="https://pl31341145.profitableratecpmnetwork.com/155237578e6f84c2a6d93ea22b88ea6d/invoke.js"></script>
                <div id="container-155237578e6f84c2a6d93ea22b88ea6d"></div>
            </div>
        </div>
    </div>

    <!-- 5. FOOTER WATERMARK -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 text-center py-1.5 bg-slate-900/90 border-t border-slate-800">
        <p class="text-slate-500 text-[10px] font-bold tracking-widest uppercase">Glory Verse - One World, One Game</p>
    </footer>

    <!-- 6. MODAL: AKSI LAHAN (CONTEXTUAL) -->
    <div id="land-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 class="text-amber-500 font-bold text-sm">📍 Informasi Lahan</h3>
                <button onclick="closeModal('land-modal')" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-3">
                <p id="land-info-text" class="text-slate-300 text-sm">Memuat data lahan...</p>
                <div id="land-actions" class="space-y-2">
                    <!-- Aksi akan di-inject via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- 7. MODAL: WITHDRAW (PHANTOM REQUIRED) -->
    <div id="withdraw-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
            <div class="text-4xl mb-3">🔒</div>
            <h3 class="text-white font-bold text-lg mb-2">Hubungkan Phantom Wallet</h3>
            <p class="text-slate-400 text-xs mb-6">Fitur withdraw hanya tersedia untuk akun yang telah terhubung ke Solana Phantom Wallet untuk keamanan dana Anda.</p>
            <button onclick="connectWallet()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition mb-3 flex items-center justify-center gap-2">
                <img src="https://phantom.app/img/phantom-icon.svg" class="w-5 h-5" alt="Phantom"> Connect Phantom
            </button>
            <button onclick="closeModal('withdraw-modal')" class="text-slate-500 text-xs hover:text-white">Batal</button>
        </div>
    </div>

    <!-- SCRIPT BAGIAN 2 AKAN DITEMPEL DI SINI -->
  <script>
        // ==========================================
        // 1. SETUP SUPABASE & VARIABEL GLOBAL
        // ==========================================
        const supabaseUrl = 'https://gfhcqbosxtcuvxttmzsm.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGNxYm9zeHRjdXZ4dHRtenNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTU1OTQsImV4cCI6MjEwMjI5MTU5NH0.kJR_qsWyqLZTP7zLld-Ejc6FazLSrjKRTzzh0BhuvXg';
        const sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

        let currentUser = null;
        let currentUserData = null;
        let map = null;
        let disasterLayer = L.layerGroup();
        let hillshadeLayer = null;
        const ADSTERRA_DIRECT_LINK = 'https://www.profitableratecpmnetwork.com/qwsxb17rg?key=78e9ecb32128c5c4cad92b6fccf76114';

        // ==========================================
        // 2. INITIALIZATION & AUTH GUARD
        // ==========================================
        async function initDashboard() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'index.html'; // Redirect jika belum login
                return;
            }
            currentUser = session.user;
            await fetchPlayerProfile();
            await initMap();
            updateLondonClock();
            setInterval(updateLondonClock, 1000);
        }

        async function fetchPlayerProfile() {
            const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            if (error) { console.error('Gagal ambil profile:', error); return; }
            
            currentUserData = data;
            document.getElementById('stat-diamond').innerText = Math.floor(data.diamond_balance || 0).toLocaleString();
            document.getElementById('stat-gold').innerText = Math.floor(data.gold_balance || 0).toLocaleString();
            document.getElementById('stat-currency').innerText = Math.floor(data.currency_balance || 0).toLocaleString();
            
            const walletBtn = document.getElementById('wallet-btn');
            if (data.wallet_address) {
                walletBtn.innerHTML = `👻 ${data.wallet_address.substring(0, 4)}...${data.wallet_address.substring(data.wallet_address.length - 4)}`;
                walletBtn.classList.replace('bg-amber-600', 'bg-purple-600');
                walletBtn.classList.replace('hover:bg-amber-500', 'hover:bg-purple-500');
            }
        }

        // ==========================================
        // 3. MAP & LIVING WORLD (OSM + TOPO + GEMPA)
        // ==========================================
        async function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Layer 1: OSM Base (Dark Mode via CSS)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            // Layer 2: Topografi (Hillshade)
            hillshadeLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenTopoMap',
                maxZoom: 17,
                className: 'hillshade-layer'
            }).addTo(map);

            disasterLayer.addTo(map);
            await loadGDACSDisasters();

            // Event Klik Peta (Contextual Interaction)
            map.on('click', async function(e) {
                await handleMapClick(e.latlng.lat, e.latlng.lng);
            });
        }

        async function loadGDACSDisasters() {
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://www.gdacs.org/gdacsapi/api/events/getevents?eventtype=EQ,FL,DR,VO,TC,WF&period=7')}`;
                const res = await fetch(proxyUrl);
                const data = await res.json();
                disasterLayer.clearLayers();
                
                const icons = { 'EQ': '🌍', 'TC': '🌀', 'FL': '🌊', 'VO': '🌋', 'WF': '🔥', 'DR': '🏜️' };
                
                data.forEach(ev => {
                    const color = ev.severity === 3 ? 'red' : (ev.severity === 2 ? 'orange' : 'green');
                    L.marker([ev.latitude, ev.longitude], {
                        icon: L.divIcon({ 
                            className: 'disaster-icon', 
                            html: `<div style="color:white; text-shadow:0 0 15px ${color};">${icons[ev.eventtype] || '⚠️'}</div>`, 
                            iconSize: [30, 30] 
                        })
                    }).bindPopup(`<b>${ev.eventtype}</b><br>${ev.name}<br><span style="color:${color}">Severity: ${ev.severity}</span>`).addTo(disasterLayer);
                });
                
                // Simpan data gempa global untuk cek zona aman/tidak saat klik
                window.activeDisasters = data;
            } catch (e) { console.error('Gagal load bencana:', e); }
        }

        // ==========================================
        // 4. LOGIKA KLIK PETA & CEK LAHAN (BACKEND READY)
        // ==========================================
        async function handleMapClick(lat, lng) {
            // 1. Cek apakah area ini terkena bencana aktif (Radius ~50km dari pusat gempa sebagai contoh)
            const inDisasterZone = window.activeDisasters?.some(ev => {
                const distance = map.distance([lat, lng], [ev.latitude, ev.longitude]);
                return ev.eventtype === 'EQ' && distance < 50000; // 50km radius aman
            });

            if (inDisasterZone) {
                showLandModal(lat, lng, 'disaster');
                return;
            }

            // 2. Tembak ke Backend untuk cek status Hexagon 100x100m di koordinat ini
            // (Nanti di backend: SELECT * FROM lands WHERE ST_DWithin(geom, ST_MakePoint(lng, lat), 0.01))
            const { data: landData, error } = await sb
                .from('lands')
                .select('id, status, owner_id, name')
                .eq('latitude', parseFloat(lat.toFixed(4))) // Simplifikasi matching untuk tes
                .eq('longitude', parseFloat(lng.toFixed(4)))
                .maybeSingle();

            if (landData) {
                showLandModal(lat, lng, landData.status, landData);
            } else {
                // Fallback jika data lahan belum di-seed ke backend
                showLandModal(lat, lng, 'unknown');
            }
        }

        function showLandModal(lat, lng, status, landData = null) {
            const modal = document.getElementById('land-modal');
            const infoText = document.getElementById('land-info-text');
            const actionsDiv = document.getElementById('land-actions');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (status === 'disaster') {
                infoText.innerHTML = `⚠️ <b>PERINGATAN BENCANA!</b><br>Area ini sedang dalam status siaga gempa/bencana. Lahan tidak stabil dan <b>tidak bisa ditanami</b> hingga kondisi aman.`;
                actionsDiv.innerHTML = `<button onclick="closeModal('land-modal')" class="w-full bg-slate-700 text-white font-bold py-3 rounded-lg">Tutup</button>`;
            } else if (status === 'kosong') {
                infoText.innerHTML = `🌱 <b>Lahan Pertanian Subur</b><br>Status: Tersedia (Platform)<br>Koordinat: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                actionsDiv.innerHTML = `
                    <button onclick="watchAdAndReward('tanam_kosong')" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
                        🌾 Sewa & Tanam (Tonton Iklan)
                    </button>
                    <button onclick="watchAdAndReward('beli_lahan')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">
                        💎 Beli Lahan (5 USDT)
                    </button>
                `;
            } else if (status === 'sultan') {
                infoText.innerHTML = `👑 <b>Lahan Sultan</b><br>Dimiliki oleh Player lain.<br>Koordinat: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                actionsDiv.innerHTML = `
                    <button onclick="watchAdAndReward('tanam_sultan')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
                        🤝 Sewa dari Sultan (Tonton Iklan)
                    </button>
                `;
            } else {
                infoText.innerHTML = `❓ <b>Lokasi Tidak Dikenal</b><br>Area ini bukan lahan pertanian yang terdaftar (misal: jalan, gedung, atau laut).`;
                actionsDiv.innerHTML = `<button onclick="closeModal('land-modal')" class="w-full bg-slate-700 text-white font-bold py-3 rounded-lg">Tutup</button>`;
            }
        }

        // ==========================================
        // 5. LOGIKA IKLAN & REWARD (ADSTERRA)
        // ==========================================
        async function watchAdAndReward(actionType) {
            // 1. Validasi Harian (Max 10x Farming)
            if (actionType.includes('tanam') && currentUserData.daily_harvest_count >= 10) {
                alert('⚠️ Batas panen harian (10x) telah tercapai. Istirahat dulu, Bos!');
                return;
            }

            // 2. Validasi Cooldown (1 Jam)
            if (currentUserData.last_harvest_time) {
                const lastHarvest = new Date(currentUserData.last_harvest_time).getTime();
                const now = Date.now();
                if ((now - lastHarvest) < 3600000) { // 1 jam = 3.600.000 ms
                    const minsLeft = Math.ceil((3600000 - (now - lastHarvest)) / 60000);
                    alert(`⏳ Cooldown aktif. Tunggu ${minsLeft} menit lagi untuk panen berikutnya.`);
                    return;
                }
            }

            // 3. Buka Iklan Adsterra di Tab Baru
            const adWindow = window.open(ADSTERRA_DIRECT_LINK, '_blank');
            
            // 4. Simulasi Tunggu Player Kembali & Beri Reward
            // (Di production, gunakan event listener 'visibilitychange' atau webhook dari backend)
            setTimeout(async () => {
                let rewardCurrency = 10; // 40% dari 25 curr (sesuai Excel)
                
                // Update Database
                const { error } = await sb.from('profiles').update({
                    currency_balance: currentUserData.currency_balance + rewardCurrency,
                    daily_harvest_count: (currentUserData.daily_harvest_count || 0) + 1,
                    last_harvest_time: new Date().toISOString()
                }).eq('id', currentUser.id);

                if (!error) {
                    alert(`✅ Berhasil! Anda mendapatkan +${rewardCurrency} Currency.`);
                    closeModal('land-modal');
                    fetchPlayerProfile(); // Refresh UI saldo
                } else {
                    console.error('Gagal update saldo:', error);
                }
            }, 5000); // Delay 5 detik sebagai simulasi waktu nonton iklan
        }

        // ==========================================
        // 6. WALLET & UI HELPERS
        // ==========================================
        async function connectWallet() {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const resp = await window.solana.connect();
                    const publicKey = resp.publicKey.toString();
                    
                    // Simpan ke database
                    await sb.from('profiles').update({ wallet_address: publicKey }).eq('id', currentUser.id);
                    
                    alert('✅ Phantom Wallet berhasil terhubung!');
                    fetchPlayerProfile();
                } catch (err) {
                    console.error('Gagal connect wallet:', err);
                }
            } else {
                alert('⚠️ Phantom Wallet tidak terdeteksi. Silakan instal ekstensi Phantom di browser Anda.');
                window.open('https://phantom.app/', '_blank');
            }
        }

        function showSection(section) {
            // Nanti diimplementasikan routing atau toggle visibility antar section
            if (section === 'profile') {
                // Contoh: buka modal withdraw jika saldo >= 75000 (30 USDT)
                if (currentUserData.currency_balance >= 75000 && !currentUserData.wallet_address) {
                    document.getElementById('withdraw-modal').classList.remove('hidden');
                    document.getElementById('withdraw-modal').classList.add('flex');
                } else {
                    alert('Fitur Profile & Withdraw sedang dalam pengembangan. Pastikan Wallet terhubung untuk pencairan.');
                }
            } else if (section === 'event') {
                window.location.href = 'geo_challenge.html';
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            document.getElementById(modalId).classList.remove('flex');
        }

        function updateLondonClock() {
            const now = new Date();
            document.getElementById('london-clock').innerText = now.toLocaleString("en-GB", { 
                timeZone: "Europe/London", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
            }) + ' GMT';
        }

        // Jalankan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
