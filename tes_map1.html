
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - GloryVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { dark: '#0B0F19', card: '#151B2B', accent: '#F59E0B' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Dark Mode Map Trick */
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .hillshade-layer .leaflet-tile { filter: none !important; opacity: 0.5; }
        .earthquake-layer .leaflet-tile { filter: none !important; }

        /* Animations */
        @keyframes pulse-alert { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .disaster-icon { font-size: 28px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); animation: pulse-alert 1.5s infinite; background: transparent; border: none; }

        /* Layout Sizing */
        #map { height: calc(100vh - 180px); width: 100%; z-index: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal Styling */
        .modal-overlay { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-brand-dark text-slate-200 font-sans overflow-x-hidden">

    <!-- 1. TOPBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 px-4 py-2 flex justify-between items-center shadow-lg h-14">
        <!-- Kiri: Jam London -->
        <div class="flex items-center gap-2 text-xs font-semibold text-blue-300 bg-slate-800 px-2 py-1 rounded-full border border-slate-700">
            <span>🇬🇧</span> <span id="london-clock">Loading...</span>
        </div>

        <!-- Tengah: 3 Mata Uang -->
        <div class="flex items-center gap-3 text-xs font-bold">
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-purple-400">
                <span>💎</span> <span id="stat-diamond">0</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-yellow-400">
                <span>💰</span> <span id="stat-gold">0</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-blue-400">
                <span>🪙</span> <span id="stat-currency">0</span>
            </div>
        </div>

        <!-- Kanan: Logo & Wallet -->
        <div class="flex items-center gap-3">
            <img src="https://gloryverse.id/img/logo-site.png" alt="GloryVerse Logo" class="h-8 w-auto object-contain">
            <button id="wallet-btn" onclick="connectWallet()" class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                👻 Connect
            </button>
        </div>
    </nav>

    <!-- 2. MENU BAR (SIMPLE) -->
    <div class="fixed top-14 left-0 right-0 z-40 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 h-10">
        <div class="max-w-7xl mx-auto flex items-center justify-center gap-2 h-full px-4">
            <button onclick="showSection('dashboard')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">🗺️ Dashboard</button>
            <button onclick="showSection('profile')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">👤 Profile</button>
            <button onclick="showSection('event')" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition">🎉 Event</button>
        </div>
    </div>

    <!-- 3. MAIN CONTENT: FULLSCREEN MAP -->
<div class="pt-24 w-full">
    <div id="map" class="w-full" style="height: calc(100vh - 140px);"></div>
</div>

    <!-- 4. NATIVE BANNER ADSTERRA (NORMAL FLOW - DI BAWAH PETA) -->
<div class="w-full bg-slate-900/90 border-t border-slate-700 py-3 px-4">
    <p class="text-slate-500 text-[10px] text-center mb-2 uppercase tracking-wider">Advertisement</p>
    <div class="max-w-3xl mx-auto overflow-hidden" style="max-height: 120px;">
        <script async="async" data-cfasync="false" src="https://pl31341145.profitableratecpmnetwork.com/155237578e6f84c2a6d93ea22b88ea6d/invoke.js"></script>
        <div id="container-155237578e6f84c2a6d93ea22b88ea6d"></div>
    </div>
</div>

    <!-- 5. FOOTER WATERMARK (NORMAL FLOW) -->
<footer class="w-full text-center py-2 bg-slate-900/90 border-t border-slate-800">
    <p class="text-slate-500 text-[10px] font-bold tracking-widest uppercase">Glory Verse - One World, One Game</p>
</footer>

    <!-- 6. MODAL: AKSI LAHAN (CONTEXTUAL) -->
    <div id="land-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 class="text-amber-500 font-bold text-sm">📍 Informasi Lahan</h3>
                <button onclick="closeModal('land-modal')" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-3">
                <p id="land-info-text" class="text-slate-300 text-sm">Memuat data lahan...</p>
                <div id="land-actions" class="space-y-2">
                    <!-- Aksi akan di-inject via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- 7. MODAL: WITHDRAW (PHANTOM REQUIRED) -->
    <div id="withdraw-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
            <div class="text-4xl mb-3">🔒</div>
            <h3 class="text-white font-bold text-lg mb-2">Hubungkan Phantom Wallet</h3>
            <p class="text-slate-400 text-xs mb-6">Fitur withdraw hanya tersedia untuk akun yang telah terhubung ke Solana Phantom Wallet untuk keamanan dana Anda.</p>
            <button onclick="connectWallet()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition mb-3 flex items-center justify-center gap-2">
                <img src="https://phantom.app/img/phantom-icon.svg" class="w-5 h-5" alt="Phantom"> Connect Phantom
            </button>
            <button onclick="closeModal('withdraw-modal')" class="text-slate-500 text-xs hover:text-white">Batal</button>
        </div>
    </div>

    <!-- SCRIPT BAGIAN 2 AKAN DITEMPEL DI SINI -->
      <script>
    const SUPABASE_URL = 'https://gfhcqbosxtcuvxttmzsm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGNxYm9zeHRjdXZ4dHRtenNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTU1OTQsImV4cCI6MjEwMjI5MTU5NH0.kJR_qsWyqLZTP7zLld-Ejc6FazLSrjKRTzzh0BhuvXg';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const MONEYTAG_LINK = 'https://uplcm.com/4/11989761';

    let currentUser = null;
    let currentUserData = null;
    let map = null;
    let disasterLayer = null;

    async function init() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        currentUser = session.user;
        await loadProfile();
        await initMap();
        setInterval(updateClock, 1000);
        updateClock();
    }

    async function loadProfile() {
        const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
        if (data) {
            currentUserData = data;
            document.getElementById('stat-diamond').innerText = Math.floor(data.diamond_balance || 0);
            document.getElementById('stat-gold').innerText = Math.floor(data.gold_balance || 0);
            document.getElementById('stat-currency').innerText = Math.floor(data.currency_balance || 0);
        }
    }

    async function initMap() {
        map = L.map('map', { zoomControl: false }).setView([-2.5, 118], 5);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17, opacity: 0.5
        }).addTo(map);

        disasterLayer = L.layerGroup().addTo(map);
        await loadEarthquakes();

        // CLICK HANDLER
        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;
            console.log('Klik:', lat, lng);
            await handleLandClick(lat, lng);
        });
    }

    async function loadEarthquakes() {
        try {
            const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
            const data = await res.json();
            disasterLayer.clearLayers();
            window.activeQuakes = [];
            data.features.forEach(q => {
                const [qlng, qlat, depth] = q.geometry.coordinates;
                const mag = q.properties.mag;
                const color = mag >= 5 ? 'red' : mag >= 4 ? 'orange' : 'yellow';
                L.marker([qlat, qlng], {
                    icon: L.divIcon({
                        className: '',
                        html: `<div style="font-size:28px;text-shadow:0 0 15px ${color};animation:pulse 1.5s infinite;"></div>`,
                        iconSize: [30, 30]
                    })
                }).bindPopup(`<b>Gempa ${mag} SR</b><br>${q.properties.place}`).addTo(disasterLayer);
                window.activeQuakes.push({ lat: qlat, lng: qlng, mag });
            });
            console.log('Gempa loaded:', data.features.length);
        } catch (e) { console.error(e); }
    }

    async function handleLandClick(lat, lng) {
        // Cek gempa (radius 100km)
        const nearQuake = window.activeQuakes?.some(q => {
            return map.distance([lat, lng], [q.lat, q.lng]) < 100000;
        });
        if (nearQuake) {
            showModal('disaster', lat, lng);
            return;
        }

        // Cari lahan dalam radius 100 meter
        const range = 0.001;
        const { data: land } = await sb
            .from('lands')
            .select('*')
            .gte('latitude', lat - range)
            .lte('latitude', lat + range)
            .gte('longitude', lng - range)
            .lte('longitude', lng + range)
            .maybeSingle();

        if (land) {
            showModal(land.status, lat, lng, land);
        } else {
            showModal('unknown', lat, lng);
        }
    }

    function showModal(status, lat, lng, land = null) {
        const modal = document.getElementById('land-modal');
        const info = document.getElementById('land-info-text');
        const actions = document.getElementById('land-actions');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        if (status === 'disaster') {
            info.innerHTML = '⚠️ <b>ZONA GEMPA!</b><br>Tidak bisa ditanami sampai kondisi aman.';
            actions.innerHTML = '<button onclick="closeModal()" class="w-full bg-slate-700 text-white py-3 rounded-lg font-bold">Tutup</button>';
        } else if (status === 'kosong') {
            info.innerHTML = ` <b>Lahan Tersedia</b><br>Koordinat: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            actions.innerHTML = `
                <button onclick="doAction('tanam')" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mb-2">🌾 Sewa & Tanam (Tonton Iklan)</button>
                <button onclick="doAction('beli')" class="w-full bg-amber-600 text-white py-3 rounded-lg font-bold">💎 Beli Lahan (5 USDT)</button>
            `;
        } else if (status === 'sultan') {
            info.innerHTML = `👑 <b>Lahan Sultan</b><br>Koordinat: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            actions.innerHTML = '<button onclick="doAction(\'tanam_sultan\')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">🤝 Sewa dari Sultan</button>';
        } else {
            info.innerHTML = '❓ <b>Lokasi Tidak Dikenal</b><br>Bukan lahan pertanian terdaftar.';
            actions.innerHTML = '<button onclick="closeModal()" class="w-full bg-slate-700 text-white py-3 rounded-lg font-bold">Tutup</button>';
        }
    }

    async function doAction(type) {
        if (type.includes('tanam') && (currentUserData.daily_harvest_count || 0) >= 10) {
            alert('Batas harian 10x tercapai!');
            return;
        }
        if (currentUserData.last_harvest_time) {
            const last = new Date(currentUserData.last_harvest_time).getTime();
            if (Date.now() - last < 3600000) {
                const mins = Math.ceil((3600000 - (Date.now() - last)) / 60000);
                alert(`Cooldown: ${mins} menit lagi`);
                return;
            }
        }

        window.open(MONEYTAG_LINK, '_blank');
        setTimeout(async () => {
            const { error } = await sb.from('profiles').update({
                currency_balance: (currentUserData.currency_balance || 0) + 10,
                daily_harvest_count: (currentUserData.daily_harvest_count || 0) + 1,
                last_harvest_time: new Date().toISOString()
            }).eq('id', currentUser.id);

            if (!error) {
                alert('✅ +10 Currency!');
                closeModal();
                loadProfile();
            }
        }, 5000);
    }

    function closeModal() {
        document.getElementById('land-modal').classList.add('hidden');
        document.getElementById('land-modal').classList.remove('flex');
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('london-clock').innerText = 
            now.toLocaleString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' GMT';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
