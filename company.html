<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Business</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3008754794200206" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--gold)}
.dim{color:var(--mut);font-size:12px}
select{background:#0b1020;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
</style>
</head>
<body data-img='region1.jpeg' data-title="Business">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a class="on" href="game.html">ACTIVITIES</a>
 <a href="market.html">MARKETS</a><a href="war.html">WAR</a>
 <a href="org.html">ORGANIZATIONS</a><a href="mapverse.html">MAPVERSE</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="card">
   <h3>🏗️ Dirikan Perusahaan</h3>
   <div class="row"><span>Jenis</span><select id="pTipe"></select></div>
   <div class="row"><span>Region</span><select id="pReg"></select></div>
   <div class="row"><span>Biaya</span><b style="color:var(--gold)" id="pCost">-</b></div>
   <button class="btn" id="foundBtn" style="width:100%">DIRIKAN PERUSAHAAN</button>
   <small class="dim">Produksi & upah harian = fase berikutnya. Koin dipotong server-side (anti-cheat).</small>
  </div>
  <div class="card">
   <h3>🏭 Perusahaan di Negara</h3>
   <table class="tbl" id="cmpTbl"><tr><th>Nama</th><th>Jenis</th><th>Pemilik</th><th>Region</th></tr></table>
  </div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
const TYPES=[['Kebun Sayur',100],['Warung Makan',150],['Pabrik Kopi',250],['Tambang Batu',500],['Bank',1000]];
const REGS=['Solok','Betawi','Priangan','Banten','Mataram','Arek','Bali','Medan','Borneo','Makassar'];
$('pTipe').innerHTML=TYPES.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('');
$('pReg').innerHTML=REGS.map(r=>`<option>${r}</option>`).join('');
const cost=()=>TYPES[+$('pTipe').value][1];
$('pTipe').onchange=()=>{$('pCost').innerText=cost()+' 🪙'};$('pCost').innerText=cost()+' 🪙';
async function load(){try{const {data:{session}}=await db.auth.getSession();
 if(!session){$('mode').innerText='MODE DEMO';return}
 $('mode').innerText='🟢 MODE ONLINE';
 const w=await db.from('wallets').select('local_coin').eq('user_id',session.user.id).single();
 $('coin').innerText=w.data?.local_coin??0;
 const {data}=await db.from('companies').select('*').order('id',{ascending:false}).limit(30);
 $('cmpTbl').innerHTML='<tr><th>Nama</th><th>Jenis</th><th>Pemilik</th><th>Region</th></tr>'+
 ((data&&data.length)?data.map(c=>`<tr><td>${c.name||'-'}</td><td>${c.type||'-'}</td><td class="dim">${c.owner_name||'-'}</td><td>${c.region||'-'}</td></tr>`).join('')
 :'<tr><td colspan="4" class="dim">Belum ada perusahaan — jadilah pengusaha pertama!</td></tr>');
}catch(e){$('mode').innerText='MODE DEMO'}}
load();
$('foundBtn').onclick=async()=>{try{
 const {data:{session}}=await db.auth.getSession();if(!session){alert('Login dulu!');return}
 const t=TYPES[+$('pTipe').value];
 const r=await db.rpc('found_company',{p_uid:session.user.id,p_tipe:t[0],p_biaya:t[1],p_region:$('pReg').value});
 const res=r.data||{};
 if(res.ok){alert('🏭 '+t[0]+' berdiri! −'+t[1]+' 🪙');load()}
 else alert('Gagal: '+(res.err||'tidak diketahui'));
}catch(e){alert('Gagal: '+String(e&&e.message||e))}};
</script>
</body></html>
