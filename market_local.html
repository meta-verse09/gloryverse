
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Market - Glory Verse</title>
<link rel="shortcut icon" href="https://gloryverse.id/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="https://gloryverse.id/dashboard.html"><img alt="gloryverse.id" src="https://gloryverse.id/img/logo-site.png"></a>
    <a class="clock" href="https://gloryverse.id/my_medals.html"><span id="server_time">10:17:07</span></a>
  </div>
  <a class="medal" href="https://gloryverse.id/my_medals.html"><i style="width:0%"></i></a>
</header>

<div class="chips">
  <a class="chip g" href="#" data-sheet="https://gloryverse.id/ajax/my_transactions.html">Income</a>
  <a class="chip w" href="#" data-sheet="https://gloryverse.id/ajax/my_alerts.html">Alerts</a>
  <a class="chip" href="https://gloryverse.id/my_pms.html">Messages</a>
  <a class="chip" href="https://gloryverse.id/my_settings.html">Settings</a>
  <a class="chip" href="https://gloryverse.id/logout.html">Logout</a>
</div>

<main class="wrap">

  <!-- ===== PROFIL RINGKAS (kosong) ===== -->
  <section class="sec"><div class="card pad">
    <div class="me"><span class="av0"></span><div><h1>—</h1><div class="small hint">—</div></div></div>
    <div class="bar"><div class="l"><b>Energy</b><span>—</span></div><div class="t"><i style="width:0%;background:var(--ok)"></i></div></div>
    <div class="bar"><div class="l"><b>Health</b><span>—</span></div><div class="t"><i style="width:0%;background:var(--bad)"></i></div></div>
    <div class="bar"><div class="l"><b>XP Level</b><span>—</span></div><div class="t"><i style="width:0%;background:var(--accent)"></i></div></div>
    <div class="money">
      <div><span>Euro</span>—</div>
      <div><span>Gold</span>—</div>
    </div>
  </div></section>

  <!-- ===== LOCAL MARKET ===== -->
  <section class="sec"><h2>Local market</h2>
    <p class="small hint" style="margin:0 4px 10px">Buy all the products that local companies are selling.</p>
    <!-- Isi pasar nanti dimuat dari backend ke sini -->
    <div class="card pad ajax" id="market_ajax"><div class="empty" style="padding:8px">No products on the market yet.</div></div>
  </section>

  <!-- ===== TEMAN ===== -->
  <section class="sec"><h2>My friends</h2>
    <div class="card" id="friends"></div>
  </section>

  <!-- ===== WORLDWIDE SHOUTS ===== -->
  <section class="sec"><h2>Worldwide shouts</h2>
    <div class="card" id="world"></div>
    <form class="card pad" style="margin-top:10px" action="https://gloryverse.id/dashboard.html" method="post" onsubmit="return confirm('Shouts are non refundable if rejected. English only and no small talk.')">
      <input name="acn" type="hidden" value="newworldshout">
      <textarea maxlength="255" name="user_shout_text" rows="3" placeholder="Message"></textarea>
      <button class="btn full" type="submit">Send shout (2 gold)</button>
    </form>
  </section>

  <p class="foot">Copyright 2026 © gloryverse.id · <a href="https://gloryverse.id/privacy_policy.html">Privacy</a> · <a href="https://gloryverse.id/tos.html">Terms</a></p>
</main>

<nav class="tabbar"><div class="wrap">
  <a href="https://gloryverse.id/dashboard.html"><b>⌂</b>Home</a>
  <a href="https://gloryverse.id/workplaces.html"><b>⚒</b>Work</a>
  <a href="https://gloryverse.id/wars.html"><b>⚔</b>Wars</a>
  <a href="#" data-menu class="on"><b>☰</b>Menu</a>
</div></nav>

<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
<script>
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')};
var flag=function(c){return '<img class="fl" alt="" src="'+B+'img/country_flags/16/'+c+'.png">'};

// Teman: ['nama','kode negara','terakhir online' (kosong = sedang online)]. Kosong dulu.
var FR=[];
document.getElementById('friends').innerHTML=(FR.length?FR.map(function(f){
  return '<div class="row"><span class="dot'+(f[2]?' y':'')+'"></span><a class="grow" href="'+B+'profile.html&id='+f[0]+'"><b style="color:var(--text)">'+esc(f[0])+'</b></a>'+
    flag(f[1])+'<span class="small hint">'+(f[2]||'online')+'</span><a href="'+B+'my_pms.html&to='+f[0]+'" title="Send a message">✉</a></div>';
}).join(''):'<div class="empty">No friends yet.</div>')+'<a class="row chev" href="'+B+'my_friends.html"><span class="grow">View all</span></a>';

// Shout dunia: [teks, pengirim, negara, kapan]. Kosong dulu.
var WS=[];
document.getElementById('world').innerHTML=WS.length?WS.map(function(w){
  return '<div class="shout2"><div>'+esc(w[0])+'</div><div class="small hint" style="margin-top:6px">by <a href="'+B+'profile.html&id='+w[1]+'">'+esc(w[1])+'</a> '+flag(w[2])+' · '+w[3]+'</div></div>';
}).join(''):'<div class="empty">No shouts yet.</div>';
</script>
</body>
</html>
