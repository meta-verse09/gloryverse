<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — Koa Ceki</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="layout.css">
<style>
.btn{background:linear-gradient(180deg,#ffd75e 0%,#f2b705 55%,#d99a00 100%);
 color:#241a00;border:1px solid #8a6400;border-radius:12px;padding:12px 20px;
 box-shadow:0 4px 0 #8a6400,0 7px 14px #0009,inset 0 1px 0 #ffffff88;
 text-shadow:0 1px 0 #ffec8a;font-weight:900;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6400}
.card{background:#0d1430cc;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px}
.dim{color:var(--mut);font-size:12px}
.chip{background:#101a3d;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;display:inline-block;margin:2px}
</style>
</head>
<body>
<div class="grid">
 <main style="padding:10px">
  <div class="card">
   <h3 style="color:var(--gold);margin:0 0 12px">🎴 Meja Koa Ceki</h3>
   
   <button class="btn" id="bSolo" style="width:100%;margin-bottom:8px">▶ MAIN SOLO</button>
   <button class="btn" id="bBuat" style="width:100%;margin-bottom:12px">🌐 BUAT MEJA MABAR</button>
   
   <div id="roomBox" style="display:none;background:#0b1020;border:1px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:12px">
    <div class="dim">Kode meja:</div>
    <div id="roomCode" style="color:var(--gold);font-size:24px;font-weight:bold;margin:6px 0"></div>
    <div class="dim" id="roomLink"></div>
    <div style="margin:8px 0">
     <span class="chip">🙂 Kamu</span>
     <span class="chip">🤖 kosong</span>
     <span class="chip">🤖 kosong</span>
     <span class="chip">🤖 kosong</span>
    </div>
    <button class="btn" id="bStart" style="width:100%">MULAI</button>
   </div>
   
   <div style="display:flex;gap:6px">
    <input id="joinCode" placeholder="kode meja..." style="flex:1;background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:10px">
    <button class="btn" id="bJoin">GABUNG</button>
   </div>
  </div>
  
  <div id="gameArea" style="display:none" class="card">
   <h3 style="color:var(--gold)">🎮 Game Area</h3>
   <p>Game akan muncul di sini...</p>
   <button class="btn" onclick="location.reload()">Kembali</button>
  </div>
 </main>
</div>

<script>
console.log(' Ceki Simple Loaded');

// BUAT MEJA
document.getElementById('bBuat').onclick = function(){
  console.log(' BUAT MEJA clicked');
  var code = Math.random().toString(36).slice(2,6).toUpperCase();
  console.log('✅ Code:', code);
  
  document.getElementById('roomCode').innerText = code;
  document.getElementById('roomLink').innerText = 'gloryverse.id/ceki?room=' + code;
  document.getElementById('roomBox').style.display = 'block';
  
  try { localStorage.setItem('gv_ceki_host', code); } catch(e){}
  
  console.log('✅ Room box displayed');
};

// MAIN SOLO
document.getElementById('bSolo').onclick = function(){
  console.log('▶️ SOLO clicked');
  document.getElementById('gameArea').style.display = 'block';
  document.querySelector('.card').style.display = 'none';
};

// GABUNG
document.getElementById('bJoin').onclick = function(){
  var code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code){ alert('Masukkan kode meja!'); return; }
  console.log('🤝 GABUNG:', code);
  alert('Fitur gabung akan segera hadir!');
};

// MULAI
document.getElementById('bStart').onclick = function(){
  console.log('🚀 MULAI clicked');
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('roomBox').style.display = 'none';
  document.querySelector('.card').style.display = 'none';
};

console.log('✅ All buttons bound');
</script>
</body>
</html>
