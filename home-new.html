<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GloryVerse - Home New</title>
  
  <!-- CSS FILES - PASTIKAN 2 BARIS INI ADA! -->
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="layout.css">
  
  <style>
    body { margin: 0; padding: 0; background: #0a0e27; }
    #nav-container { width: 100%; }
    #main-wrapper { display: flex; min-height: calc(100vh - 80px); }
    #sidebar-container { width: 250px; flex-shrink: 0; }
    #content-container { flex: 1; padding: 20px; }
  </style>
</head>
<body>
  <!-- Container Navbar -->
  <div id="nav-container"></div>
  
  <!-- Wrapper untuk Sidebar + Konten -->
  <div id="main-wrapper">
    <!-- Container Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Container Konten Utama -->
    <div id="content-container">
  
  <!-- STAGE: Gambar Region -->
  <div class="main-stage" style="background:#000; border-radius:12px; overflow:hidden; margin-bottom:20px; border:2px solid #f0c040; position:relative;">
    <img id="region-image" src="region1.jpeg" alt="Region" style="width:100%; height:400px; object-fit:cover; display:block; transition:opacity 0.5s;">
    <div id="region-label" style="position:absolute; bottom:15px; left:15px; background:rgba(0,0,0,0.7); color:#f0c040; padding:8px 16px; border-radius:8px; font-weight:bold;">📍 Markas Utama</div>
  </div>

  <!-- INFO: Keterangan Region -->
  <div class="stage-info" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; border:1px solid #f0c040; margin-bottom:20px;">
    <h2 id="region-title" style="color:#f0c040; margin-top:0;">🏠 Markas Utama - Region 1</h2>
    <p id="region-desc" style="color:#fff; line-height:1.6;">Selamat datang di Markas Utama. Pilih region di bawah untuk melihat wilayah tersebut.</p>
  </div>

  <!-- TOMBOL REGION -->
  <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;">
    <button class="region-btn" onclick="switchRegion('region1.jpeg', 'Markas Utama', 'Pusat kendali utama player. Dari sini kamu bisa memulai petualangan.')">🏠 Markas</button>
    <button class="region-btn" onclick="switchRegion('reg_solok.jpeg', 'Solok', 'Ibukota Negara. Region utama dengan produktivitas tinggi.')">👑 Solok</button>
    <button class="region-btn" onclick="switchRegion('reg_betawi.jpeg', 'Betawi', 'Region metropolitan dengan pasar terbesar.')">🏙️ Betawi</button>
    <button class="region-btn" onclick="switchRegion('reg_priangan.jpeg', 'Priangan', 'Region pegunungan dengan hasil pertanian melimpah.')">⛰️ Priangan</button>
    <button class="region-btn" onclick="switchRegion('reg_banten.jpeg', 'Banten', 'Region pesisir dengan jalur perdagangan ramai.')">⚓ Banten</button>
    <button class="region-btn" onclick="switchRegion('reg_mataram.jpeg', 'Mataram', 'Region bersejarah dengan budaya kuat.')">️ Mataram</button>
    <button class="region-btn" onclick="switchRegion('reg_arek.jpeg', 'Arek', 'Region industri dengan teknologi maju.')">⚙️ Arek</button>
    <button class="region-btn" onclick="switchRegion('reg_bali.jpeg', 'Bali', 'Region pariwisata dengan pendapatan turis tinggi.')"> Bali</button>
    <button class="region-btn" onclick="switchRegion('reg_medan.jpeg', 'Medan', 'Region Sumatera dengan sumber daya alam kaya.')">🌿 Medan</button>
    <button class="region-btn" onclick="switchRegion('reg_borneo.jpeg', 'Borneo', 'Region Kalimantan dengan hutan dan tambang.')">🌳 Borneo</button>
    <button class="region-btn" onclick="switchRegion('reg_makassar.jpeg', 'Makassar', 'Region Sulawesi dengan pelabuhan strategis.')"> Makassar</button>
  </div>

  <!-- STYLE TOMBOL REGION -->
  <style>
    .region-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    .region-btn:hover, .region-btn.active {
      background: #f0c040;
      color: #1a1a2e;
      border-color: #f0c040;
    }
  </style>

  <!-- SCRIPT SWITCH REGION -->
  <script>
    function switchRegion(imgSrc, name, desc) {
      const img = document.getElementById('region-image');
      const label = document.getElementById('region-label');
      const title = document.getElementById('region-title');
      const descEl = document.getElementById('region-desc');
      
      // Fade effect
      img.style.opacity = '0.3';
      
      setTimeout(() => {
        img.src = imgSrc;
        label.textContent = '📍 ' + name;
        title.textContent = '🗺️ Region ' + name;
        descEl.textContent = desc;
        img.style.opacity = '1';
      }, 300);
      
      // Highlight tombol aktif
      document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>

</div>

  </div>
  
 <!-- Load Navbar HTML -->
  <script>
    window.$ = id => document.getElementById(id);
    
    function loadComponent(url, containerId) {
      fetch(url)
        .then(r => r.text())
        .then(html => {
          const container = $(containerId);
          container.innerHTML = html;
          
          // Eksekusi script di dalam HTML yang di-load
          const scripts = container.querySelectorAll('script');
          scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => {
              newScript.setAttribute(attr.name, attr.value);
            });
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        })
        .catch(e => console.error('Gagal load ' + url + ':', e));
    }
    
    // Load Navbar & Sidebar
    loadComponent('navbar.html', 'nav-container');
    loadComponent('sidebar.html', 'sidebar-container');
  </script>
  
  <!-- Load Navbar JS (Logic Popup) -->
  <script src="navbar.js"></script>
 <!-- Load Components -->

            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        })
        .catch(e => console.error('Gagal load ' + url + ':', e));
    }
    
    loadComponent('navbar.html', 'nav-container');
    loadComponent('sidebar.html', 'sidebar-container');
  </script>
  
  <!-- Load CSS Files -->
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="sidebar.css">
  
  <!-- Load JS Files -->
  <script src="navbar.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
