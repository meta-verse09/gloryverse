<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GloryVerse - Home New</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
  <style>
    body { margin: 0; padding: 0; background: #0a0e27; }
    #nav-container { width: 100%; }
    #main-wrapper { display: flex; min-height: calc(100vh - 80px); }
    #sidebar-container { width: 250px; flex-shrink: 0; }
    #content-container { flex: 1; padding: 20px; }
  </style>
</head>
<body>
  <!-- Container Navbar -->
  <div id="nav-container"></div>
  
  <!-- Wrapper untuk Sidebar + Konten -->
  <div id="main-wrapper">
    <!-- Container Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Container Konten Utama -->
    <div id="content-container">
    
    <!-- 1. AREA STAGE (Gambar/Video Utama) -->
    <div class="main-stage" style="background:#000; border-radius:12px; overflow:hidden; margin-bottom:20px; border:2px solid #f0c040;">
      <!-- Nanti ini bisa diganti <video> untuk iklan -->
      <img src="region1.jpeg" alt="Pemandangan Utama" style="width:100%; height:400px; object-fit:cover; display:block;">
    </div>

    <!-- 2. AREA INFO (Keterangan di bawah gambar) -->
    <div class="stage-info" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; border:1px solid #f0c040;">
      <h2 style="color:#f0c040; margin-top:0;">Markas Utama - Region 1</h2>
      <p style="color:#fff; line-height:1.6;">
        Ini adalah area deskripsi. Di halaman Ceki, nanti isinya tentang Juara/Liga. 
        Di halaman War, nanti isinya tentang History Battle/Damage.
      </p>
      
      <!-- Contoh tombol aksi -->
      <button style="background:#f0c040; color:#000; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">
        MULAI AKTIVITAS
      </button>
    </div>

  </div>
  
  <script>
    // Function $ global
    window.$ = id => document.getElementById(id);
    
    // Load Navbar
    fetch('navbar.html')
      .then(r => r.text())
      .then(h => { $('nav-container').innerHTML = h; })
      .catch(e => console.error('Navbar error:', e));
    
    // Load Sidebar
    fetch('sidebar.html')
      .then(r => r.text())
      .then(h => { $('sidebar-container').innerHTML = h; })
      .catch(e => console.error('Sidebar error:', e));
  </script>
</body>
</html>
