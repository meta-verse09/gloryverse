  
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - GloryVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { dark: '#0B0F19', card: '#151B2B', accent: '#F59E0B' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        #map { height: 60vh; min-height: 400px; width: 100%; z-index: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .custom-plane-icon, .iss-icon { background: transparent; border: none; }
    </style>
</head>
<body class="bg-brand-dark text-slate-200 font-sans">

    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-slate-900">G</div>
            <span class="font-bold text-lg tracking-tight hidden sm:block text-white">GLORY<span class="text-amber-500">VERSE</span></span>
        </div>

        <div class="flex items-center gap-2 text-sm font-semibold">
            <div class="hidden md:flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-blue-300">
                <span>🇬🇧</span> <span id="london-clock">Loading...</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="text-yellow-400">💰</span> <span id="stat-gold">0</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="text-blue-400"></span> <span id="stat-currency">0</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="wallet-btn" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg transition flex items-center gap-1">
                👻 Connect
            </button>
            <div class="w-8 h-8 bg-slate-700 rounded-full border-2 border-amber-500 flex items-center justify-center text-sm font-bold cursor-pointer" id="user-avatar">U</div>
        </div>
    </nav>

    <!-- MENU BAR -->
    <div class="fixed top-[56px] left-0 right-0 z-40 bg-slate-800/90 backdrop-blur-md border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex items-center justify-center overflow-x-auto py-2 px-2 gap-2 no-scrollbar">
            <button onclick="openPanel('dashboard')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap">🗺️ Dashboard</button>
            <button onclick="openPanel('profile')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap">👤 Profile</button>
            <button onclick="openPanel('activities')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap">⚔️ Activities</button>
            <button onclick="openPanel('events')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap">🏆 Events</button>
            <button onclick="openPanel('business')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap">🏢 Business</button>
            <button onclick="openPanel('financial')" class="flex-shrink-0 bg-slate-700 hover:bg-amber-600 text-white text-[10px] sm:text-xs font-bold px-3 py-2 rounded-lg transition whitespace-nowrap"> Financial</button>
        </div>
    </div>

    <!-- SIDE PANEL -->
    <div id="side-panel" class="fixed top-[105px] right-2 sm:right-4 z-[600] w-72 sm:w-80 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-xl shadow-2xl transform translate-x-[120%] transition-transform duration-300">
        <div class="flex justify-between items-center p-4 border-b border-slate-700">
            <h3 id="panel-title" class="text-amber-500 font-bold text-sm uppercase tracking-wider">MENU</h3>
            <button onclick="closePanel()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
        </div>
        <div id="panel-content" class="p-4 space-y-2 max-h-[70vh] overflow-y-auto"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="pt-[105px] pb-8 min-h-screen">
        
        <!-- PETA -->
        <div class="relative w-full bg-slate-800/50 border-b border-slate-700">
            <div id="map"></div>
        </div>

        <!-- STATS CARDS -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 backdrop-blur-sm text-center">
                    <h4 class="text-amber-500 font-bold mb-1 text-sm"> Total Companies</h4>
                    <p class="text-2xl font-bold text-white" id="stat-total-companies">0</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 backdrop-blur-sm text-center">
                    <h4 class="text-amber-500 font-bold mb-1 text-sm">⚔️ Wars Won</h4>
                    <p class="text-2xl font-bold text-white">0</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 backdrop-blur-sm text-center">
                    <h4 class="text-amber-500 font-bold mb-1 text-sm"> Net Worth</h4>
                    <p class="text-2xl font-bold text-white" id="stat-net-worth">$0</p>
                </div>
            </div>

            <!-- ADSTERRA NATIVE BANNER -->
            <div class="bg-slate-800/30 border border-slate-700 rounded-xl p-4 backdrop-blur-sm mb-8">
                <p class="text-slate-400 text-xs text-center mb-2">Advertisement</p>
                <div class="flex justify-center min-h-[90px] items-center">
                    <script async="async" data-cfasync="false" src="https://pl31341145.profitableratecpmnetwork.com/155237578e6f84c2a6d93ea22b88ea6d/invoke.js"></script>
                    <div id="container-155237578e6f84c2a6d93ea22b88ea6d"></div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="text-center py-6 text-slate-500 text-xs border-t border-slate-800 bg-slate-900/50">
            <p class="font-bold text-slate-400 tracking-widest uppercase">Glory Verse - One World, One Game</p>
            <p class="mt-1">&copy; 2024 GloryVerse. All rights reserved.</p>
        </footer>
    </div>

    <!-- MODAL BANGUN COMPANY -->
    <div id="build-modal" class="hidden fixed inset-0 z-[1000] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-md w-full max-h-[80vh] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-slate-700 bg-slate-800/50">
                <div>
                    <h3 class="text-amber-500 font-bold text-base">🏗️ Bangun Company</h3>
                    <p class="text-slate-400 text-xs mt-1">Koordinat: <span id="selected-coords" class="text-white font-mono">-</span></p>
                </div>
                <button onclick="closeBuildModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <p class="text-slate-300 text-xs mb-3">Pilih company yang ingin dibangun:</p>
                <div id="company-list" class="space-y-2"></div>
            </div>
            <div class="p-4 border-t border-slate-700 bg-slate-800/50 flex justify-end gap-2">
                <button onclick="closeBuildModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg text-sm transition">Batal</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        // 1. SETUP SUPABASE
        const supabaseUrl = 'https://gfhcqbosxtcuvxttmzsm.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGNxYm9zeHRjdXZ4dHRtenNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTU1OTQsImV4cCI6MjEwMjI5MTU5NH0.kJR_qsWyqLZTP7zLld-Ejc6FazLSrjKRTzzh0BhuvXg';
        const sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

        let currentUser = null;
        let currentUserData = null;
        let map = null;
        let selectedCoordinates = null;
        
        let liveLayers = {
            earthquakes: L.layerGroup(),
            flights: L.layerGroup(),
            iss: null
        };

        // 2. AUTH GUARD & INIT
        async function initDashboard() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            await fetchPlayerProfile();
            await initMap();
            updateLondonClock();
            setInterval(updateLondonClock, 1000);
        }

        async function fetchPlayerProfile() {
            const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            if (error) { console.error('Gagal ambil profile:', error); return; }
            
            currentUserData = data;
            document.getElementById('user-avatar').innerText = (data.username || 'U')[0].toUpperCase();
            document.getElementById('stat-gold').innerText = Math.floor(data.gold_balance || 0).toLocaleString();
            document.getElementById('stat-currency').innerText = Math.floor(data.currency_balance || 0).toLocaleString();
            document.getElementById('stat-net-worth').innerText = '$' + (Math.floor((data.gold_balance || 0) + (data.currency_balance || 0) * 0.1)).toLocaleString();
            
            const walletBtn = document.getElementById('wallet-btn');
            if (data.wallet_address) {
                const addr = data.wallet_address;
                walletBtn.innerText = `👻 ${addr.substring(0, 4)}...${addr.substring(addr.length - 4)}`;
            }
        }

        // 3. MAP & LIVING WORLD (THE MIRACLE)
        async function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            liveLayers.earthquakes.addTo(map);
            liveLayers.flights.addTo(map);

            // Load Regions + CUACA LIVE
            const { data: regions } = await sb.from('regions').select('*');
            if (regions) {
                for (const region of regions) {
                    // Fetch Cuaca Real-time dari Open-Meteo (GRATIS, TANPA API KEY)
                    let weatherText = "Memuat cuaca...";
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${region.latitude}&longitude=${region.longitude}&current_weather=true`);
                        const wData = await res.json();
                        if (wData.current_weather) {
                            const temp = wData.current_weather.temperature;
                            const wind = wData.current_weather.windspeed;
                            const code = wData.current_weather.weathercode;
                            let icon = "☀️";
                            if (code > 3) icon = "⛅";
                            if (code > 45) icon = "🌫️";
                            if (code > 50) icon = "🌧️";
                            if (code > 70) icon = "❄️";
                            if (code > 90) icon = "⛈️";
                            weatherText = `${icon} ${temp}°C | Angin: ${wind} km/h`;
                        }
                    } catch (e) { weatherText = "Cuaca tidak tersedia"; }

                    const marker = L.marker([region.latitude, region.longitude]).addTo(map);
                    marker.bindPopup(`
                        <div style="color: #1e293b; min-width: 150px;">
                            <h3 style="font-weight: bold; font-size: 16px; margin-bottom: 5px;">${region.name}</h3>
                            <p style="font-size: 12px; color: #64748b; margin-bottom: 8px;">${region.region_type} | ${region.weather_modifier}</p>
                            <div style="background: #f1f5f9; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: bold;">
                                🌦️ Cuaca Live: ${weatherText}
                            </div>
                        </div>
                    `);
                }
            }

            // Load Player Assets
            const { data: assets } = await sb.from('player_assets').select('*').eq('owner_id', currentUser.id);
            if (assets) {
                assets.forEach(asset => {
                    if (asset.latitude && asset.longitude) {
                        const markerIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div style="background-color: #F59E0B; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px #F59E0B;"></div>`,
                            iconSize: [16, 16], iconAnchor: [8, 8]
                        });
                        L.marker([asset.latitude, asset.longitude], { icon: markerIcon })
                         .bindPopup(`<b>${asset.asset_name}</b><br>Level ${asset.level}`)
                         .addTo(map);
                    }
                });
                document.getElementById('stat-total-companies').innerText = assets.length;
            }

            startLivingWorld();
        }

        function startLivingWorld() {
            fetchEarthquakes();
            fetchFlights();
            fetchISS();
            // Update setiap 30 detik
            setInterval(() => {
                fetchEarthquakes();
                fetchFlights();
                fetchISS();
            }, 30000);
        }

        // --- FITUR 1: GEMPA BUMI LIVE (USGS) ---
        async function fetchEarthquakes() {
            liveLayers.earthquakes.clearLayers();
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
                const data = await response.json();
                data.features.forEach(quake => {
                    const coords = quake.geometry.coordinates;
                    const mag = quake.properties.mag;
                    const color = mag > 5 ? '#ff0000' : (mag > 4 ? '#ff8800' : '#ffff00');
                    L.circle([coords[1], coords[0]], {
                        color: color, fillColor: color, fillOpacity: 0.4, radius: mag * 4000
                    }).bindPopup(`🌍 <b>Gempa!</b><br>M: ${mag}<br>${quake.properties.place}`).addTo(liveLayers.earthquakes);
                });
            } catch (e) { console.error('Gempa error', e); }
        }

        // --- FITUR 2: PESAWAT LIVE (OpenSky) ---
        async function fetchFlights() {
            liveLayers.flights.clearLayers();
            const bounds = map.getBounds();
            const url = `https://opensky-network.org/api/states/all?lamin=${bounds.getSouth()}&lomin=${bounds.getWest()}&lamax=${bounds.getNorth()}&lomax=${bounds.getEast()}`;
            try {
                const response = await fetch(url);
                if (!response.ok) return; // Abaikan jika diblokir CORS/Rate limit
                const data = await response.json();
                if (data.states) {
                    data.states.slice(0, 30).forEach(flight => {
                        const lon = flight[5], lat = flight[6];
                        if (lat && lon) {
                            const icon = L.divIcon({
                                className: 'custom-plane-icon',
                                html: `<div style="transform: rotate(${flight[10] || 0}deg); color: #00ffff; font-size: 14px; text-shadow: 0 0 5px #000;">✈️</div>`,
                                iconSize: [20, 20]
                            });
                            L.marker([lat, lon], { icon }).bindPopup(`✈️ ${flight[1].trim() || 'Unknown'}<br>${flight[2]}`).addTo(liveLayers.flights);
                        }
                    });
                }
            } catch (e) { /* Abaikan error CORS */ }
        }

        // --- FITUR 3: ISS LIVE ---
        async function fetchISS() {
            if (liveLayers.iss) map.removeLayer(liveLayers.iss);
            try {
                const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                const data = await res.json();
                const icon = L.divIcon({
                    className: 'iss-icon',
                    html: `<div style="color: #fff; font-size: 18px; animation: pulse 2s infinite; text-shadow: 0 0 10px #fff;">🛰️</div>`,
                    iconSize: [20, 20]
                });
                liveLayers.iss = L.marker([data.latitude, data.longitude], { icon })
                    .bindPopup(`<b>ISS (Stasiun Luar Angkasa)</b><br>Speed: ${Math.round(data.velocity)} km/h<br>Alt: ${Math.round(data.altitude)} km`).addTo(map);
            } catch (e) {}
        }

        // 4. PANEL & MODAL LOGIC
        const panelData = {
            dashboard: { title: '🗺️ DASHBOARD', items: [{ icon: '', label: 'World Map', action: 'closePanel()' }] },
            profile: { title: '👤 PROFILE', items: [{ icon: '', label: 'Inventory', action: 'closePanel()' }, { icon: '💎', label: 'Top Up', action: 'closePanel()' }] },
            activities: { title: '⚔️ ACTIVITIES', items: [{ icon: '⚒️', label: 'Work / Gather', action: 'closePanel()' }] },
            business: { title: ' BUSINESS', items: [{ icon: '🌍', label: 'Global Market', action: 'closePanel()' }] },
            financial: { title: ' FINANCIAL', items: [{ icon: '💱', label: 'Exchange', action: 'closePanel()' }] }
        };

        function openPanel(key) {
            const data = panelData[key];
            if (!data) return;
            document.getElementById('panel-title').innerText = data.title;
            document.getElementById('panel-content').innerHTML = data.items.map(item => `
                <button onclick="${item.action}" class="w-full flex items-center gap-3 p-3 bg-slate-800 hover:bg-amber-600 rounded-lg transition text-left">
                    <span class="text-lg">${item.icon}</span>
                    <span class="text-white font-semibold text-sm">${item.label}</span>
                </button>
            `).join('');
            document.getElementById('side-panel').classList.remove('translate-x-[120%]');
        }

        function closePanel() {
            document.getElementById('side-panel').classList.add('translate-x-[120%]');
        }

        // Klik Peta untuk Bangun
        map?.on('click', function(e) {
            if (!currentUser) { alert('Silakan login terlebih dahulu!'); return; }
            selectedCoordinates = { lat: e.latlng.lat, lng: e.latlng.lng };
            openBuildModal(selectedCoordinates);
        });

        function openBuildModal(coords) {
            document.getElementById('selected-coords').innerText = `${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
            document.getElementById('company-list').innerHTML = `
                <div class="flex items-center justify-between p-3 bg-slate-800 hover:bg-slate-700 rounded-lg transition cursor-pointer border border-slate-700 hover:border-amber-500 mb-2" onclick="selectCompany('Pabrik Pengolahan', 500, 0)">
                    <div><p class="text-white font-semibold text-sm"> Pabrik Pengolahan</p><p class="text-slate-400 text-xs">Level 1 • Mengolah resource</p></div>
                    <span class="text-amber-500 text-xs font-bold">500 Currency</span>
                </div>
                <div class="flex items-center justify-between p-3 bg-slate-800 hover:bg-slate-700 rounded-lg transition cursor-pointer border border-slate-700 hover:border-amber-500 mb-2" onclick="selectCompany('Kantor Perdagangan', 0, 10)">
                    <div><p class="text-white font-semibold text-sm">🏢 Kantor Perdagangan</p><p class="text-slate-400 text-xs">Level 1 • Bonus market</p></div>
                    <span class="text-amber-500 text-xs font-bold">10 Gold</span>
                </div>
            `;
            document.getElementById('build-modal').classList.remove('hidden');
            document.getElementById('build-modal').classList.add('flex');
        }

        function closeBuildModal() {
            document.getElementById('build-modal').classList.add('hidden');
            document.getElementById('build-modal').classList.remove('flex');
            selectedCoordinates = null;
        }

        async function selectCompany(name, costCurr, costGold) {
            if (!selectedCoordinates || !currentUser || !currentUserData) return;
            
            if (currentUserData.currency_balance < costCurr || currentUserData.gold_balance < costGold) {
                alert(`❌ Saldo tidak cukup!`);
                return;
            }
            if (!confirm(`Bangun ${name} seharga ${costCurr} Currency & ${costGold} Gold?`)) return;

            const { error: insertError } = await sb.from('player_assets').insert({
                owner_id: currentUser.id,
                asset_type: 'company',
                asset_name: name,
                level: 1,
                condition: 100,
                latitude: selectedCoordinates.lat,
                longitude: selectedCoordinates.lng
            });

            if (insertError) { alert('Gagal membangun: ' + insertError.message); return; }

            await sb.from('profiles').update({
                currency_balance: currentUserData.currency_balance - costCurr,
                gold_balance: currentUserData.gold_balance - costGold
            }).eq('id', currentUser.id);

            const markerIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: #F59E0B; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px #F59E0B;"></div>`,
                iconSize: [16, 16], iconAnchor: [8, 8]
            });
            L.marker([selectedCoordinates.lat, selectedCoordinates.lng], { icon: markerIcon })
             .bindPopup(`<b>${name}</b><br>Level 1`).addTo(map);

            alert(`✅ ${name} berhasil dibangun!`);
            closeBuildModal();
            fetchPlayerProfile();
            
            const currentCount = parseInt(document.getElementById('stat-total-companies').innerText);
            document.getElementById('stat-total-companies').innerText = currentCount + 1;
        }

        function updateLondonClock() {
            const now = new Date();
            document.getElementById('london-clock').innerText = now.toLocaleString("en-GB", { timeZone: "Europe/London", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        // Jalankan
        initDashboard();
    </script>
</body>
</html>
