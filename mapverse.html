<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloryVerse — MapVerse</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css">
<style>.pano{display:none}
#mvPano{height:260px;border-radius:12px;border:1px solid var(--line);
 background-size:auto 100%;background-repeat:repeat-x;cursor:grab;touch-action:pan-y;margin:8px 0;background-color:#0b1020}
.row{display:flex;gap:6px;margin:6px 0;align-items:center}
input{flex:1;background:#0b1020;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}
.hint{border-left:3px solid var(--gold);padding:4px 8px;margin:4px 0;font-size:13px;background:#0b1020;border-radius:4px}
#judge{margin:8px 0;padding:10px;border-radius:12px;border:1px solid var(--gold);background:#1b2c55;display:none;font-size:14px}</style>
</head>
<body data-img="region1.jpeg" data-title="MapVerse">
<header><b class="logo">⚔️ GloryVerse</b>
 <span class="chip" id="clock">--:--:--</span><span class="chip" id="wthr">🌤️</span>
 <span class="chip">🪙 <b id="coin">0</b></span><span class="chip">⚡ <b id="en">100</b></span>
 <span class="chip" style="margin-left:auto;background:#14532d;color:#bbf7d0" id="mode">...</span></header>
<nav class="main"><a href="home.html">HOME</a><a href="game.html">ACTIVITIES</a>
 <a class="on" href="mapverse.html">MAPVERSE</a><a href="forum.html">FORUM</a>
 <a href="market.html">MARKETS</a><a href="rank.html">RANKINGS</a></nav>
<div class="grid">
 <aside class="side" id="left"></aside>
 <main>
  <div class="pano" id="pano"><div id="sky"></div><div id="fx"></div><div id="markers"></div>
   <div class="panoHint">↔ 360° • <span id="locName"></span></div></div>
  <div class="card"><h3>🗺️ MapVerse — Edisi Nusantara</h3>
   <small style="color:var(--mut)">Foto NYATA acak dari Mapillary. Drag ↔, baca plat & atap, tebak provinsi — juri Llama mengomentari!</small></div>
  <div id="mvPano"></div>
  <div class="row"><button class="btn" id="hintBtn">💡 Tanya Burung Hantu (3)</button>
   <span class="chip" id="st">Ronde 1</span></div>
  <div id="hints"></div>
  <div class="row"><input id="guess" placeholder="contoh: Sumatera Barat">
   <button class="btn" id="goBtn">TEBAK!</button></div>
  <div id="judge"></div>
  <div class="row"><button class="btn" id="nextBtn" style="display:none">RONDE BERIKUT →</button></div>
 </main>
 <aside class="side" id="right"></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="layout.js"></script>
<script>
let UID=null;
(async()=>{try{const {data:{session}}=await db.auth.getSession();
 if(session){UID=session.user.id;$('mode').innerText='🟢 MODE ONLINE';}
 else $('mode').innerText='MODE DEMO';}catch(e){}})();
const ACC={
 'Sumatera Barat':['sumbar','padang','sumatera barat','bukittinggi','minang'],
 'Jawa Timur':['jawa timur','surabaya','malang','madura','rawon'],
 'Bali':['bali','denpasar','ubud','gianyar']};
let cur=null,curUrl='',hints=3,tries=0,round=1,solved=false;
async function gv(body){try{const r=await fetch('https://gv-ai.m-gazali1975.workers.dev/',
 {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 return await r.json();}catch(e){return {}}}
async function start(){hints=3;tries=0;solved=false;
 $('hints').innerHTML='';$('judge').style.display='none';
 $('nextBtn').style.display='none';$('guess').value='';
 $('hintBtn').innerText='💡 Tanya Burung Hantu (3)';
 const p=$('mvPano');p.style.backgroundImage='';p.innerText='memuat dunia nyata...';
 const d=await gv({mly_rand:1});
 if(!d.url){p.innerText='Gagal memuat spot: '+(d.error||'cek token Mapillary di worker.');return;}
 cur={name:d.name,accept:ACC[d.name]||[d.name.toLowerCase()]};curUrl=d.url;
 p.innerText='';p.style.backgroundImage=`url('${curUrl}')`;
 let pos=0,drag=null;
 p.onpointerdown=e=>{drag={x:e.clientX,pos};p.setPointerCapture(e.pointerId);};
 p.onpointermove=e=>{if(drag){pos=drag.pos+(e.clientX-drag.x);p.style.backgroundPositionX=pos+'px';}};
 ['pointerup','pointercancel'].forEach(v=>p.addEventListener(v,()=>drag=null));
 $('st').innerText='Ronde '+round;}
$('hintBtn').onclick=async()=>{if(solved||hints<=0||!curUrl)return;hints--;
 $('hintBtn').innerText='💡 Tanya Burung Hantu ('+hints+')';
 const d=await gv({prompt:'Foto jalan di Indonesia. Beri petunjuk kecil tentang provinsinya TANPA menyebut nama provinsi. Satu kalimat santai.',image_url:curUrl});
 const el=document.createElement('div');el.className='hint';
 el.innerText='🦉 '+(d.text||'Hmm... perhatikan plat motor & bentuk atapnya...');
 $('hints').appendChild(el);};
$('goBtn').onclick=async()=>{if(solved)return;
 const g=$('guess').value.trim().toLowerCase();if(!g)return;tries++;
 const ok=cur.accept.some(a=>g.includes(a));
 const J=$('judge');J.style.display='block';
 if(ok){solved=true;const rw=Math.max(10,30-(3-hints)*10);
  if(UID)db.rpc('work_once',{uid:UID,coin:rw,en:0}).catch(()=>{});
  const d=await gv({prompt:`Foto Indonesia. Tebakan pemain: "${g}". Jawaban benar: "${cur.name}". Vonis BENAR. Pujian santai lucu maks 15 kata.`,image_url:curUrl});
  J.innerHTML=`<b style="color:var(--gold)">BENAR! +${rw} 🪙</b><br>🦙 ${d.text||'Matamu tajam, Kawan! 🦅'}`;
  $('nextBtn').style.display='block';
 }else if(tries>=2){solved=true;
  const d=await gv({prompt:`Foto Indonesia. Tebakan pemain: "${g}". Jawaban benar: "${cur.name}". Vonis SALAH. Kalimat santai menghibur & menyebut jawaban, maks 15 kata.`,image_url:curUrl});
  J.innerHTML=`<b style="color:#f87171">BELUM TEPAT.</b><br>🦙 ${d.text||('Jawabannya: '+cur.name+'.')}`;
  $('nextBtn').style.display='block';
 }else J.innerHTML='<b style="color:var(--gold)">BELUM!</b> Satu kesempatan lagi 🔍';};
$('nextBtn').onclick=()=>{round++;start();};
start();
</script>
</body></html>
