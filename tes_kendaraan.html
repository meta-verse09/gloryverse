<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GloryVerse - Tes Kendaraan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html,body{ height:100%; margin:0; background:#0b1630; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #map{ height:100%; }
  #hud{
    position:fixed; z-index:1000; left:10px; right:10px; top:10px;
    background:rgba(11,22,48,.9); color:#f3efe3; border:1px solid #f2a516;
    border-radius:10px; padding:8px 10px; font-size:13px;
  }
  #hud .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #hud button{ background:#1b2a4d; color:#f3efe3; border:1px solid #3a4b76; border-radius:8px; padding:7px 10px; font-size:13px; }
  #hud button.on{ background:#f2a516; color:#0b1630; border-color:#f2a516; font-weight:700; }
  #hud label{ margin-left:auto; display:flex; gap:4px; align-items:center; }
  #status{ margin-top:7px; line-height:1.4; }
  #status b{ color:#f2a516; }

  /* ===== Kendaraan ===== */
  .veh{ transition:transform .25s linear; filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
  .track{ stroke:#2a2f22; stroke-width:9; stroke-dasharray:5 3; }
  .wheel{ stroke:#222; stroke-width:4; stroke-dasharray:4 3; }
  .moving .track, .moving .wheel{ animation:roda .35s linear infinite; }  /* roda berputar saat jalan */
  @keyframes roda{ to{ stroke-dashoffset:-8; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="row">
    <button data-k="plane">Pesawat</button>
    <button data-k="truck">Truk</button>
    <button data-k="tank">Tank</button>
    <label><input type="checkbox" id="fast">Uji cepat</label>
    <button id="reset">Reset</button>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ====== 1. PENGATURAN ======
const TIME_SCALE = 6;      // waktu nyata dibagi 6 (100 km @ 40 km/jam: 2,5 jam jadi 25 menit)
const FAST_EXTRA = 100;    // pengali tambahan saat "Uji cepat" dicentang (supaya demo tidak menunggu lama)
const KEY = 'gv_kendaraan';

// Tiap kendaraan: kecepatan NYATA (km/jam), apakah terbang, warna rute, posisi awal, ikon SVG (menghadap ke atas)
const UNITS = {
  plane: { label:'Pesawat', kmh:800, air:true,  color:'#4fc3f7', start:[-6.13,106.66], size:[48,48],
    svg:`<svg viewBox="0 0 48 48" width="48" height="48"><path d="M24 2 L28 18 L46 28 L46 32 L28 27 L27 38 L33 43 L33 46 L24 44 L15 46 L15 43 L21 38 L20 27 L2 32 L2 28 L20 18 Z" fill="#e8ecef" stroke="#5b6670" stroke-width="1.2"/></svg>` },
  truck: { label:'Truk',    kmh:60,  air:false, color:'#f2a516', start:[-6.91,107.61], size:[30,62],
    svg:`<svg viewBox="0 0 30 62" width="30" height="62">
      <line class="wheel" x1="2" y1="6" x2="2" y2="18"/><line class="wheel" x1="28" y1="6" x2="28" y2="18"/>
      <line class="wheel" x1="2" y1="32" x2="2" y2="58"/><line class="wheel" x1="28" y1="32" x2="28" y2="58"/>
      <rect x="4" y="22" width="22" height="38" rx="2" fill="#dfe3e6" stroke="#6b737b"/>
      <rect x="5" y="3" width="20" height="17" rx="3" fill="#f2a516" stroke="#8a5d05"/>
      <rect x="8" y="6" width="14" height="5" fill="#9bd1f0"/></svg>` },
  tank:  { label:'Tank',    kmh:40,  air:false, color:'#8bc34a', start:[-7.80,110.37], size:[40,56],
    svg:`<svg viewBox="0 0 40 56" width="40" height="56">
      <line class="track" x1="7" y1="6" x2="7" y2="50"/><line class="track" x1="33" y1="6" x2="33" y2="50"/>
      <rect x="10" y="8" width="20" height="40" rx="4" fill="#6b7a3a" stroke="#3b4420" stroke-width="1.5"/>
      <rect x="18" y="0" width="4" height="26" rx="1.5" fill="#3b4420"/>
      <circle cx="20" cy="30" r="9" fill="#7d8e45" stroke="#3b4420" stroke-width="1.5"/>
      <circle cx="20" cy="30" r="3" fill="#f2a516"/></svg>` }
};

// ====== 2. PETA ======
const map = L.map('map', { zoomControl:false }).setView([-7.2, 108.5], 7);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap' }).addTo(map);
map.attributionControl.addAttribution('Rute &copy; OSRM');

// ====== 3. STATE: satu unit untuk tiap kendaraan ======
// s.pos = posisi, s.job = perjalanan aktif {pts, cum, total, km, start, end, realMs}, s.rot = sudut hadap
const S = {};
for (const k in UNITS){
  const u = UNITS[k];
  const icon = L.divIcon({
    html:`<div class="veh" style="width:${u.size[0]}px;height:${u.size[1]}px">${u.svg}</div>`,
    className:'', iconSize:u.size, iconAnchor:[u.size[0]/2, u.size[1]/2]
  });
  S[k] = { pos:u.start.slice(), job:null, rot:0, idx:0, loading:false, line:null, dot:null,
           marker:L.marker(u.start, { icon, interactive:false }).addTo(map) };
}
let sel = 'tank';
const el = k => S[k].marker.getElement().querySelector('.veh');

// ====== 4. UTILITAS ======
function bearing(a, b){   // derajat: 0 = utara, 90 = timur
  const p = L.CRS.EPSG3857.project(L.latLng(a)), q = L.CRS.EPSG3857.project(L.latLng(b));
  return Math.atan2(q.x - p.x, q.y - p.y) * 180 / Math.PI;
}
function fmt(ms){         // milidetik jadi "1j 20m" / "25m 10d" / "40d"
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), d = s % 60;
  return h ? h + 'j ' + m + 'm' : m ? m + 'm ' + d + 'd' : d + 'd';
}

// ====== 5. RUTE: jalan nyata (OSRM) atau garis lurus (pesawat) ======
async function roadRoute(a, b){
  const url = `https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
  const j = await (await fetch(url)).json();
  if (j.code !== 'Ok') throw new Error(j.code);
  return j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);   // OSRM urutannya lng,lat
}

// Yang disimpan hanya titik rute + waktu mulai/tiba. Posisi dihitung dari JAM, bukan disimpan terus.
// Di game asli: Date.now() diganti jam server (London), job disimpan di Supabase.
function makeJob(k, pts){
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + L.latLng(pts[i-1]).distanceTo(pts[i]));
  const total = cum[cum.length - 1], km = total / 1000;
  const realMs = km / UNITS[k].kmh * 3600000;                         // waktu tempuh NYATA
  const gameMs = Math.max(1000, realMs / (TIME_SCALE * (document.getElementById('fast').checked ? FAST_EXTRA : 1)));
  return { pts, cum, total, km, realMs, start:Date.now(), end:Date.now() + gameMs };
}

async function startTrip(k, to){
  const s = S[k], u = UNITS[k];
  if (s.loading) return;
  s.loading = true; setStatus(k, 'Mencari rute...');
  try {
    const pts = u.air ? [s.pos, to] : [s.pos].concat(await roadRoute(s.pos, to));
    s.job = makeJob(k, pts); s.idx = 0;
    drawRoute(k); save();
  } catch (e) {
    statusEl.dataset.msg = '1';   // tahan pesan ini sampai pemain mengetuk lagi
    setStatus(k, 'Tidak ada jalan ke titik itu (seberang laut?). Pilih titik di daratan yang sama, atau pakai Pesawat.');
  }
  s.loading = false;
}

function drawRoute(k){
  const s = S[k]; clearRoute(k);
  if (!s.job) return;
  const pts = s.job.pts, c = UNITS[k].color;
  s.line = L.polyline(pts, { color:c, weight:4, opacity:.9, dashArray: UNITS[k].air ? '8 8' : null }).addTo(map);
  s.dot = L.circleMarker(pts[pts.length - 1], { radius:7, color:c, fillColor:'#c0392b', fillOpacity:1 }).addTo(map);
}
function clearRoute(k){
  const s = S[k];
  if (s.line) map.removeLayer(s.line);
  if (s.dot) map.removeLayer(s.dot);
  s.line = s.dot = null;
}

// ====== 6. POSISI DI SEPANJANG RUTE (dari fraksi waktu k) ======
function posAt(s, frac){
  const job = s.job, cum = job.cum, d = frac * job.total;
  let i = s.idx || 0;
  if (i >= cum.length - 1 || cum[i] > d) i = 0;
  while (i < cum.length - 2 && cum[i+1] < d) i++;
  s.idx = i;
  const seg = cum[i+1] - cum[i], f = seg ? Math.min(1, Math.max(0, (d - cum[i]) / seg)) : 0;
  const a = job.pts[i], b = job.pts[i+1];
  return { pos:[a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f], a, b, seg };
}

function turnTo(s, deg){  // putar lewat sisi terdekat supaya tidak muter 360 derajat
  const delta = ((deg - s.rot + 540) % 360) - 180;
  s.rot += delta;
}

// ====== 7. LOOP ANIMASI ======
const statusEl = document.getElementById('status');
function setStatus(k, text){ if (k === sel) statusEl.innerHTML = text; }

function tick(){
  for (const k in S){
    const s = S[k], e = el(k);
    if (!e) continue;
    if (s.job){
      const frac = (Date.now() - s.job.start) / (s.job.end - s.job.start);
      if (frac >= 1){
        s.pos = s.job.pts[s.job.pts.length - 1].slice(); s.job = null; clearRoute(k); save();
        e.classList.remove('moving');
      } else {
        const p = posAt(s, Math.max(0, frac));
        s.pos = p.pos;
        if (p.seg > 1) turnTo(s, bearing(p.a, p.b));
        e.style.transform = 'rotate(' + s.rot + 'deg)';
        e.classList.add('moving');
      }
    } else {
      e.classList.remove('moving');
    }
    s.marker.setLatLng(s.pos);
  }
  // status unit yang sedang dipilih
  const s = S[sel], u = UNITS[sel];
  if (!s.loading){
    if (s.job){
      statusEl.innerHTML = '<b>' + u.label + '</b> ' + s.job.km.toFixed(0) + ' km. Waktu asli ' + fmt(s.job.realMs) +
        ', tiba dalam <b>' + fmt(s.job.end - Date.now()) + '</b>';
    } else if (!statusEl.dataset.msg){
      statusEl.innerHTML = '<b>' + u.label + '</b> siaga (' + u.kmh + ' km/jam). Ketuk peta untuk tujuan.';
    }
  }
  requestAnimationFrame(tick);
}

// ====== 8. SIMPAN, BUKA, KONTROL ======
function save(){
  try {
    const o = { sel, units:{} };
    for (const k in S) o.units[k] = { pos:S[k].pos, job:S[k].job, rot:S[k].rot };
    localStorage.setItem(KEY, JSON.stringify(o));
  } catch (e) {}
}
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o) return;
    if (UNITS[o.sel]) sel = o.sel;
    for (const k in o.units){ if (!S[k]) continue; S[k].pos = o.units[k].pos; S[k].job = o.units[k].job; S[k].rot = o.units[k].rot || 0; }
  } catch (e) {}
}
load();
for (const k in S){ if (S[k].job) drawRoute(k); }

const btns = document.querySelectorAll('#hud button[data-k]');
function mark(){ btns.forEach(b => b.classList.toggle('on', b.dataset.k === sel)); }
btns.forEach(b => b.onclick = () => { sel = b.dataset.k; mark(); statusEl.dataset.msg = ''; save(); });
mark();

map.on('click', e => { statusEl.dataset.msg = ''; startTrip(sel, [e.latlng.lat, e.latlng.lng]); });

document.getElementById('reset').onclick = () => {
  for (const k in S){
    const s = S[k]; s.job = null; s.pos = UNITS[k].start.slice(); s.rot = 0; clearRoute(k);
    s.marker.setLatLng(s.pos); const e = el(k); if (e){ e.style.transform = 'rotate(0deg)'; e.classList.remove('moving'); }
  }
  save();
};
requestAnimationFrame(tick);
</script>
</body>
</html>
