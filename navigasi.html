<script type="module">
  // === 1. INISIALISASI SUPABASE ===
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://gfhcqbosxtcuvxttmzsm.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGNxYm9zeHRjdXZ4dHRtenNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTU1OTQsImV4cCI6MjEwMjI5MTU5NH0.kJR_qsWyqLZTP7zLld-Ejc6FazLSrjKRTzzh0BhuvXg'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  // Fungsi ambil data dari Supabase — panggil di halaman masing-masing
  window.ambilData = async function(namaTabel) {
    const { data, error } = await supabase
      .from(namaTabel)
      .select('*')
      .order('waktu', { ascending: false })

    if (error) console.error('Error ambil data:', error)
    return data
  }

  // === 2. JAM LONDON OTOMATIS ===
  function updateLondonClock() {
    const now = new Date()
    const londonTime = now.toLocaleTimeString('en-GB', {
      timeZone: 'Europe/London',
      hour12: false
    })
    document.getElementById("server_time").innerHTML = londonTime

    // Update garis kemajuan waktu
    const d = new Date()
    const detikHarian = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()
    const persen = (detikHarian / 86400) * 100
    document.getElementById("time-progress").style.width = persen.toFixed(1) + '%'
  }

  setInterval(updateLondonClock, 1000)
  updateLondonClock()
</script>
