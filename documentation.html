<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
<script>
// Sumber isi dokumentasi: halaman dokumentasi ASLI (yang lama) disimpan dengan nama ini.
// Ganti alamatnya kalau file lama Anda simpan di tempat lain.
var DOC_SOURCE='documentation_old.html';

// Membersihkan HTML lama: buang gaya/warna/font yang tertanam supaya ikut tema terang/gelap
function clean(el){
  el.querySelectorAll('font').forEach(function(f){f.replaceWith.apply(f,f.childNodes)});
  el.querySelectorAll('*').forEach(function(n){
    ['style','color','face','size','dir','id','class','role','aria-level'].forEach(function(a){n.removeAttribute(a)});
  });
  el.querySelectorAll('p').forEach(function(p){if(!p.textContent.trim()&&!p.querySelector('img'))p.remove()});
  el.querySelectorAll('a[href]').forEach(function(a){a.target='_blank';a.rel='noopener'});
  return el.innerHTML;
}

var box=document.getElementById('docs');
fetch(DOC_SOURCE,{credentials:'include'}).then(function(r){return r.text()}).then(function(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var out='';
  doc.querySelectorAll('.panel-default').forEach(function(p){
    var a=p.querySelector('.panel-heading a'),body=p.querySelector('.panel-body');
    if(!a||!body)return;
    out+='<details class="doc" id="'+a.getAttribute('href').replace('#','')+'"><summary>'+a.textContent.trim()+'</summary><div class="doc-body">'+clean(body)+'</div></details>';
  });
  box.innerHTML=out||'<div class="card empty">Documentation is empty.</div>';
  // Tautan lama seperti documentation.html#collapse7 tetap membuka bagian yang benar
  var t=location.hash&&document.getElementById(location.hash.slice(1));
  if(t&&t.tagName==='DETAILS'){t.open=true;t.scrollIntoView()}
}).catch(function(){box.innerHTML='<div class="card empty">Could not load the documentation. Please try again later.</div>'});

// Pencarian
document.getElementById('q').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase(),shown=0;
  box.querySelectorAll('details.doc').forEach(function(d){
    var hit=!q||d.textContent.toLowerCase().indexOf(q)>-1;
    d.classList.toggle('hide',!hit);
    d.open=!!q&&hit&&q.length>1;
    if(hit)shown++;
  });
  document.getElementById('none').classList.toggle('hide',shown>0);
});
</script>
</body>
</html>
