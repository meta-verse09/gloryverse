
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OSM 3D Exporter - Free Version</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
  
  #header { background: #2a2a2a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; height: 50px; }
  #header h1 { font-size: 18px; color: #4CAF50; }
  #header h1 span { color: white; }
  #header small { font-size: 11px; color: #888; }
  
  #map-container { position: relative; height: calc(100vh - 50px); width: 100%; }
  #map { width: 100%; height: 100%; z-index: 1; }
  
  #controls {
    position: absolute; top: 20px; right: 20px; background: rgba(42, 42, 42, 0.95);
    padding: 20px; border-radius: 10px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 1000; max-height: calc(100vh - 100px); overflow-y: auto;
  }
  
  #controls h2 { font-size: 16px; margin-bottom: 15px; color: #4CAF50; border-bottom: 1px solid #444; padding-bottom: 8px; }
  .control-group { margin-bottom: 12px; }
  .control-group > label { display: block; margin-bottom: 6px; font-size: 13px; color: #ccc; font-weight: bold; }
  .control-group input[type="text"], .control-group select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 6px; font-size: 14px; }
  .checkbox-label { display: flex !important; align-items: center; gap: 8px; margin: 8px 0 !important; font-size: 13px !important; font-weight: normal !important; cursor: pointer; }
  .checkbox-label input { width: auto !important; margin: 0; transform: scale(1.2); }
  
  .btn { width: 100%; padding: 14px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
  .btn:hover { background: #45a049; }
  .btn:active { background: #3d8b40; }
  .btn:disabled { background: #555; cursor: not-allowed; }
  
  #status { margin-top: 15px; padding: 10px; background: #1a1a1a; border-radius: 6px; font-size: 12px; min-height: 36px; border: 1px solid #333; }
  .area-info { background: #1a1a1a; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 12px; border: 1px solid #333; }
  .area-info div { margin: 4px 0; }
  .area-info span { color: #4CAF50; font-weight: bold; }

  @media (max-width: 768px) {
    #controls { top: auto; bottom: 0; right: 0; left: 0; width: 100%; border-radius: 15px 15px 0 0; max-height: 60vh; padding: 15px 20px 25px 20px; }
    #controls::before { content: ''; display: block; width: 40px; height: 4px; background: #555; border-radius: 2px; margin: 0 auto 15px auto; }
  }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="header">
  <h1>urban<span>EXPORT</span> <small>Free</small></h1>
  <div style="color:#888;font-size:12px;"> Unlimited</div>
</div>

<div id="map-container">
  <div id="map"></div>
  
  <div id="controls">
    <h2>📦 Export Settings</h2>
    <div class="area-info">
      <div>📏 Area: <span id="area-size">1.0 × 1.0 km</span></div>
      <div>📍 Center: <span id="center-coord">-6.1754, 106.8272</span></div>
      <div>🏢 Buildings: <span id="building-count">-</span></div>
    </div>
    
    <div class="control-group">
      <label>Format Export</label>
      <select id="format">
        <option value="obj">OBJ (3D Model - Unity/Blender)</option>
        <option value="json">JSON (Three.js)</option>
        <option value="geojson">GeoJSON (GIS)</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Include Layers</label>
      <label class="checkbox-label"><input type="checkbox" id="include-buildings" checked> Buildings (Gedung)</label>
      <label class="checkbox-label"><input type="checkbox" id="include-roads" checked> Roads (Jalan)</label>
      <label class="checkbox-label"><input type="checkbox" id="include-water"> Water (Sungai/Danau)</label>
    </div>
    
    <div class="control-group">
      <label>Tinggi Gedung</label>
      <select id="height-mode">
        <option value="real">Real (Sesuai data OSM)</option>
        <option value="random">Random (5 - 30 meter)</option>
        <option value="uniform">Seragam (15 meter)</option>
      </select>
    </div>
    
    <button class="btn" id="export-btn" onclick="exportArea()">🚀 Export Area</button>
    <div id="status">Klik tombol di atas untuk mulai download...</div>
  </div>
</div>

<script>
// ============================================================
// 1. SETUP MAP (Leaflet)
// ============================================================
const map = L.map('map', { zoomControl: false }).setView([-6.1754, 106.8272], 15); 
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM', maxZoom: 19
}).addTo(map);

let areaBounds = null;
const defaultSize = 0.0045; // ~500m radius (1km x 1km total)

function updateAreaBox() {
  if (areaBounds) map.removeLayer(areaBounds);
  const center = map.getCenter();
  const bounds = [
    [center.lat - defaultSize, center.lng - defaultSize],
    [center.lat + defaultSize, center.lng + defaultSize]
  ];
  areaBounds = L.rectangle(bounds, { color: '#4CAF50', weight: 3, fillOpacity: 0.1, dashArray: '5, 10' }).addTo(map);
  document.getElementById('center-coord').textContent = `${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`;
}
updateAreaBox();
map.on('moveend', updateAreaBox);

// ============================================================
// 2. FETCH OSM DATA
// ============================================================
async function fetchOSMData(bounds) {
  const bbox = [bounds[0][0], bounds[0][1], bounds[1][0], bounds[1][1]].join(',');
  const includeBuildings = document.getElementById('include-buildings').checked;
  const includeRoads = document.getElementById('include-roads').checked;
  const includeWater = document.getElementById('include-water').checked;
  
  let query = `[out:json][timeout:30];(\n`;
  if (includeBuildings) query += `way["building"](${bbox});\n`;
  if (includeRoads) query += `way["highway"~"motorway|trunk|primary|secondary|tertiary|residential|service"](${bbox});\n`;
  if (includeWater) query += `way["natural"="water"](${bbox});\n`;
  query += `);out geom;`;
  
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST', body: 'data=' + encodeURIComponent(query)
  });
  if (!res.ok) throw new Error('Gagal connect ke Overpass API');
  return await res.json();
}

// (LANJUT KE BAGIAN 2 DI BAWAH INI)

  // ============================================================
// 3. CONVERT TO 3D DATA
// ============================================================
function processOSMData(data, bounds) {
  const elements = data.elements;
  const buildings = [], roads = [], waters = [];
  const centerLat = (bounds[0][0] + bounds[1][0]) / 2;
  const centerLon = (bounds[0][1] + bounds[1][1]) / 2;
  
  function latLonToXY(lat, lon) {
    const x = (lon - centerLon) * Math.cos(centerLat * Math.PI/180) * 111320;
    const y = -(lat - centerLat) * 110540;
    return { x, y };
  }
  
  elements.forEach(el => {
    if (!el.geometry || el.geometry.length < 2) return;
    const points = el.geometry.map(n => latLonToXY(n.lat, n.lon));
    
    if (el.tags && el.tags.building) {
      let height = 15;
      const heightMode = document.getElementById('height-mode').value;
      if (heightMode === 'real') height = parseFloat(el.tags.height) || (parseInt(el.tags['building:levels']) || 1) * 3.5;
      else if (heightMode === 'random') height = 5 + Math.random() * 25;
      
      buildings.push({ type: 'building', points: points, height: Math.min(Math.max(height, 4), 50), tags: el.tags });
    }
    if (el.tags && el.tags.highway) {
      roads.push({ type: 'road', points: points, width: el.tags.highway === 'motorway' ? 12 : el.tags.highway === 'primary' ? 8 : 5, tags: el.tags });
    }
    if (el.tags && el.tags.natural === 'water') {
      waters.push({ type: 'water', points: points, tags: el.tags });
    }
  });
  return { buildings, roads, waters, center: { lat: centerLat, lon: centerLon } };
}

// ============================================================
// 4. EXPORT FUNCTIONS
// ============================================================
function exportToOBJ(data) {
  let obj = '# OSM 3D Export\n# Generated by urbanEXPORT Free\n\n';
  let vertexOffset = 1;
  data.buildings.forEach((b, idx) => {
    obj += `o building_${idx}\n`;
    b.points.forEach(p => obj += `v ${p.x.toFixed(2)} 0 ${p.y.toFixed(2)}\n`);
    b.points.forEach(p => obj += `v ${p.x.toFixed(2)} ${b.height.toFixed(2)} ${p.y.toFixed(2)}\n`);
    obj += `f`; for (let i = 0; i < b.points.length; i++) obj += ` ${vertexOffset + i}`; obj += '\n';
    obj += `f`; for (let i = b.points.length - 1; i >= 0; i--) obj += ` ${vertexOffset + b.points.length + i}`; obj += '\n';
    for (let i = 0; i < b.points.length; i++) {
      const next = (i + 1) % b.points.length;
      obj += `f ${vertexOffset + i} ${vertexOffset + next} ${vertexOffset + b.points.length + next} ${vertexOffset + b.points.length + i}\n`;
    }
    vertexOffset += b.points.length * 2;
  });
  return obj;
}

function exportToJSON(data) { return JSON.stringify(data, null, 2); }

function exportToGeoJSON(data) {
  const features = data.buildings.map(b => ({
    type: 'Feature',
    geometry: { type: 'Polygon', coordinates: [b.points.map(p => [p.x, p.y])] },
    properties: { type: 'building', height: b.height, tags: b.tags }
  }));
  return { type: 'FeatureCollection', features };
}

// ============================================================
// 5. MAIN EXPORT FUNCTION
// ============================================================
async function exportArea() {
  const btn = document.getElementById('export-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '⏳ Mengambil data...';
  status.textContent = 'Sedang connect ke server OSM...';
  
  try {
    const center = map.getCenter();
    const bounds = [
      [center.lat - defaultSize, center.lng - defaultSize],
      [center.lat + defaultSize, center.lng + defaultSize]
    ];
    
    const osmData = await fetchOSMData(bounds);
    const processed = processOSMData(osmData, bounds);
    
    document.getElementById('building-count').textContent = processed.buildings.length;
    status.textContent = `✅ Ditemukan ${processed.buildings.length} gedung. Memproses file...`;
    
    const format = document.getElementById('format').value;
    let output, filename, mime;
    
    if (format === 'obj') { output = exportToOBJ(processed); filename = `osm_export_${Date.now()}.obj`; mime = 'text/plain'; } 
    else if (format === 'json') { output = exportToJSON(processed); filename = `osm_export_${Date.now()}.json`; mime = 'application/json'; } 
    else { output = exportToGeoJSON(processed); filename = `osm_export_${Date.now()}.geojson`; mime = 'application/json'; }
    
    const blob = new Blob([output], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    
    status.textContent = ` Berhasil! File ${filename} sudah didownload.`;
    btn.textContent = ' Export Area';
  } catch (e) {
    status.textContent = `❌ Error: ${e.message}`;
    btn.textContent = '🚀 Export Area';
  }
  btn.disabled = false;
}
</script>
</body>
</html>
